// 粘贴图片：从剪贴板直接贴（截图后 Ctrl+V 就能发）
inp.addEventListener('paste', async (e) => {
  const items = [...((e.clipboardData && e.clipboardData.items) || [])];
  const pic = items.find(it => it.kind === 'file' && /^image\//.test(it.type));
  if (!pic) return;                       // 纯文本粘贴走默认行为
  e.preventDefault();
  const f = pic.getAsFile();
  if (!f) return;
  const ext = (f.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
  const named = new File([f], `粘贴图片-${Date.now()}.${ext}`, { type: f.type || 'image/png' });

});

let pendingAttach = null;   // 已上传、待随下一条消息一起发送的附件
function renderPending(){
  const w = $('pendingWrap');
  if (!pendingAttach) { w.style.display = 'none'; w.innerHTML = ''; return; }
  const a = pendingAttach;
  w.style.display = 'block';
  const thumb = a.kind === 'image' ? `<img src="${esc(a.url)}">` : a.kind === 'video' ? '🎬' : '📎';
  w.innerHTML = `<div class="pendingItem">${thumb}<span>${esc(a.name)}</span><button id="pendDel" title="移除">✕</button></div>`;
  $('pendDel').onclick = () => { pendingAttach = null; renderPending(); };

async function prepareAttach(file, kind){
  if (file.size > 20 * 1024 * 1024) { alert('文件超过 20MB'); return; }
  $('attachBtn').disabled = true; $('attachBtn').textContent = '…';
  try {
    const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
    const base64 = String(dataUrl).split(',')[1] || '';
    const up = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: file.name, mime: file.type, data: base64 }) }).then(r => r.json());
    if (!up.ok) { alert('上传失败：' + (up.error || '未知')); return; }
    pendingAttach = { url: up.url, name: up.name, mime: up.mime, kind };
    renderPending();
    $('in').focus();                       // 上传完回到输入框，接着写你要说的话
  } catch (err) { alert('上传失败：' + err.message); }
  finally { $('attachBtn').disabled = false; $('attachBtn').textContent = '＋'; }
}

function send(){
  const t = inp.value.trim();
  if (!t && !pendingAttach) return;
  inp.value = '';
  const attach = pendingAttach;
  pendingAttach = null; renderPending();
  fetch('/api/send', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room: active, text: t, attach }) });
}
$('send').onclick = send;
// ---------- @ 成员选择（微信式） ----------
let mentionItems = [], mentionIdx = 0, mentionStart = -1;
function closeMention(){ $('mentionPop').style.display = 'none'; mentionItems = []; mentionStart = -1; }
function updateMention(){
  const v = inp.value, pos = inp.selectionStart ?? v.length;
  const before = v.slice(0, pos);
  const m = /@([^\s@]{0,12})$/.exec(before);
  if (!m) return closeMention();
  const q = m[1].toLowerCase();
  const list = roomMembers(active).filter(x => !q || x.name.toLowerCase().includes(q) || String(x.model).toLowerCase().includes(q));
  if (!list.length) return closeMention();
  mentionItems = list.slice(0, 8);
  mentionStart = pos - m[0].length;
  mentionIdx = 0;
  const pop = $('mentionPop');
  pop.innerHTML = mentionItems.map((x, i) =>
    `<div class="mentionItem${i === 0 ? ' on' : ''}" data-i="${i}"><b>${esc(x.name)}</b><span class="mm2">${esc(x.model)}</span></div>`).join('');
  pop.style.display = 'block';
  pop.querySelectorAll('.mentionItem').forEach(d => {
    d.onmousedown = (e) => { e.preventDefault(); pickMention(+d.dataset.i); };
  });
}
function paintMention(){
  $('mentionPop').querySelectorAll('.mentionItem').forEach((d, i) => d.classList.toggle('on', i === mentionIdx));
}
function pickMention(i){
  const it = mentionItems[i];
  if (!it) return closeMention();
  const v = inp.value, pos = inp.selectionStart ?? v.length;
  const head = v.slice(0, mentionStart);
  const tail = v.slice(pos);
  const insert = '@' + it.name + ' ';
  inp.value = head + insert + tail;
  const np = head.length + insert.length;
  inp.setSelectionRange(np, np);
  inp.focus();
  closeMention();
}
// 输入框：跟着内容长高；右上角把手可手动拉高/拉宽，尺寸记住
(function () {
  const bar = $('inputbar'), grip = $('ibGrip'), ta = inp;
  const KEY = 'rt-composer-size';
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(220, Math.max(26, ta.scrollHeight)) + 'px'; };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (s.w) bar.style.maxWidth = s.w + 'px';
    if (s.h) ta.style.height = s.h + 'px';
  } catch (e) {}
  grow();
  ta.addEventListener('input', grow);
  let dragging = false, sx = 0, sy = 0, bw = 0, bh = 0;
  grip.addEventListener('mousedown', (e) => {
    e.preventDefault(); e.stopPropagation();
    dragging = true; sx = e.clientX; sy = e.clientY;
    bw = bar.getBoundingClientRect().width; bh = ta.getBoundingClientRect().height;
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const w = Math.min(1100, Math.max(360, bw + (e.clientX - sx) * 2));   // 框居中，所以 ×2
    const h = Math.min(240, Math.max(26, bh - (e.clientY - sy)));
    bar.style.maxWidth = Math.round(w) + 'px';
    ta.style.height = Math.round(h) + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    try { localStorage.setItem(KEY, JSON.stringify({ w: parseInt(bar.style.maxWidth) || 760, h: parseInt(ta.style.height) || 0 })); } catch (e) {}
  });
})();
inp.addEventListener('input', updateMention);
inp.addEventListener('click', updateMention);
inp.onkeydown = (e) => {
  const open = $('mentionPop').style.display === 'block';
  if (open) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      mentionIdx = (mentionIdx + (e.key === 'ArrowDown' ? 1 : -1) + mentionItems.length) % mentionItems.length;
      paintMention();
      return;
    }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(mentionIdx); return; }
    if (e.key === 'Escape') { e.preventDefault(); closeMention(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
};

// ---------- 启动 + SSE ----------
fetch('/api/state').then(r => r.json()).then(s => {
  M = s.members; rooms = s.rooms; states = s.states || {}; netOnline = s.netOnline !== false; maxR = s.maxRounds;
  roomSettings = s.settings || {}; histDefault = s.histDefault || 6000;
  topics = {}; (s.topics || []).forEach(t => { topics[t.id] = t; });
  if (s.appTitle) { $('appTitle').textContent = s.appTitle; document.title = s.appTitle + ' · 多模型聊天'; }
  if (s.theme) applyTheme(s.theme); else applyTheme({ dark: true, gradient: true, pattern: 'none' });
  setNet(netOnline);
  renderSide();
  showHome();                                   // 落地页：主界面，点房间才进去
});
const es = new EventSource('/api/events');
es.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'msg') {
    if (ev.rec.room === active) { if (loading) pendingRows.push(ev.rec); else msgRow(ev.rec); }
    return;
  }
  if (ev.type === 'status') { states[ev.id] = { down: ev.down, speaking: ev.speaking }; const m = memberById(ev.id); if (m) paint(m); renderStatusBar(); return; }
  if (ev.type === 'topic-deleted') {
    delete topics[ev.id];
    if (active === 't:' + ev.id) showHome();
    renderSide();
    return;
  }
  if (ev.type === 'topic') {
    topics[ev.topic.id] = ev.topic;
    if (active === ev.topic.roomId) { renderStatusBar(); renderTopicPanel(); }
    return;
  }
  if (ev.type === 'round') { if (ev.room === active) { roundInfo[active] = { calls: ev.calls, paused: ev.paused, who: ev.who, beat: ev.beat, total: ev.total }; renderStatusBar(); } return; }
  if (ev.type === 'net') { setNet(ev.online); return; }
  if (ev.type === 'rooms') { rooms = ev.rooms; renderSide(); renderStatusBar(); return; }
  if (ev.type === 'app') { $('appTitle').textContent = ev.title; document.title = ev.title + ' · 多模型聊天'; return; }
  if (ev.type === 'theme') { applyTheme(ev.theme); return; }
  if (ev.type === 'members') { M = ev.members.filter((m, i, a) => a.findIndex(x => x.id === m.id) === i); renderSide(); return; }
  if (ev.type === 'cleared') { if (ev.room === active) { msgs.innerHTML = ''; renderHomeEmpty(); } delete unread[ev.room]; renderSide(); return; }
  if (ev.type === 'imported') { if (ev.room === active) openRoom(ev.room); return; }
  if (ev.type === 'deleted') {    if (ev.room === active) {
      const firstRow = ev.ids.map(id => document.getElementById(id)).filter(Boolean)[0];
      const anchor = firstRow ? firstRow.nextSibling : null;
      ev.ids.forEach(id => document.getElementById(id)?.remove());
      if (ev.notice) { const row = msgRow(ev.notice); if (row) msgs.insertBefore(row, anchor); }   // 留痕插回原位置
    }
    return;
  }
  if (ev.type === 'start' && ev.room === active) {
    if (loading) return;                              // 加载窗口内不建流式行，等 end 事件补画
    const row = document.createElement('div');
    row.className = 'row'; row.id = ev.id;
    row.innerHTML = `${ava(ev.from)}<div class="msg" style="background:${colorForName(ev.from)};color:${textOn(colorForName(ev.from))}"><div class="who">${esc(ev.from)} · ${hhmm()}</div><div class="body">…</div></div>`;
    msgs.appendChild(row); msgs.scrollTop = msgs.scrollHeight; streaming[ev.id] = row; return;
  }
  if (ev.type === 'delta' && streaming[ev.id]) { const b = streaming[ev.id].querySelector('.body'); if (b.textContent === '…') b.textContent = ''; b.textContent += ev.text; msgs.scrollTop = msgs.scrollHeight; return; }
  if (ev.type === 'end') {
    const row = streaming[ev.id];
    if (ev.room === active) {
      if (row) { if (ev.rec) row.querySelector('.body').textContent = ev.rec.text; }
      else if (ev.rec && !loading) msgRow(ev.rec);   // 中途切进来时补画（加载窗口内交给 pendingRows）
      delete streaming[ev.id];
    } else if (ev.rec) { unread[ev.room] = (unread[ev.room] || 0) + 1; renderSide(); }
  }
};
</script>
