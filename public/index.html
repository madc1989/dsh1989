<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>圆桌 · 多模型聊天</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; height: 100vh; display: flex; color: #1f2937; overflow: hidden;
         background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 35%, #fce7f3 65%, #fef3c7 100%); background-attachment: fixed; }
  /* 左侧栏：与右侧同一套半透明玻璃 */
  #side { width: 230px; padding: 12px 8px 6px; flex-shrink: 0; position: relative; color: #1f2937; display: flex; flex-direction: column;
          background: rgba(255,255,255,.52); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
          border-right: 1px solid rgba(255,255,255,.8); }
  #sideScroll { flex: 1; overflow-y: auto; min-height: 0; }
  #sideFoot { padding: 6px 2px 0; border-top: 1px solid rgba(255,255,255,.85); margin-top: 4px; }
  #setBtn { width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; border: 0; background: transparent; color: #374151; cursor: pointer; font-size: 13px; }
  #setBtn:hover { background: rgba(255,255,255,.75); }
  #setMenu { display: none; position: absolute; left: 10px; bottom: 46px; z-index: 45; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; box-shadow: 0 10px 24px rgba(17,24,39,.18); padding: 5px; min-width: 140px; }
  #setMenu div { padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #setMenu div:hover { background: rgba(0,0,0,.06); }
  #sideHead { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 6px; }
  #sideHead b { font-size: 15px; cursor: pointer; border-radius: 6px; padding: 2px 4px; }
  #sideHead b:hover { background: rgba(255,255,255,.8); }
  #plusBtn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.65); color: #374151; font-size: 16px; line-height: 1; cursor: pointer; }
  #plusBtn:hover { background: rgba(255,255,255,.95); }
  #plusMenu { display: none; position: absolute; right: 10px; top: 44px; z-index: 40; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; padding: 5px; min-width: 140px; box-shadow: 0 10px 24px rgba(17,24,39,.18); }
  #plusMenu div { padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #plusMenu div:hover { background: rgba(0,0,0,.06); }
  .sec { font-size: 11px; color: #6b7280; padding: 10px 8px 6px; letter-spacing: .5px; }
  .item { display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: 10px; cursor: pointer; margin-bottom: 3px; }
  .item:hover { background: rgba(255,255,255,.7); }
  .item.active { background: #2563eb; color: #fff; }
  .item.off { opacity: .45; }
  .ava { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #111827; flex-shrink: 0; position: relative; }
  .dot { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; background: #22c55e; }
  .dot.off { background: #6b7280; }
  .dot.typing { background: #f59e0b; animation: blink 1s infinite; }
  .unread { position: absolute; right: -1px; top: -1px; width: 9px; height: 9px; border-radius: 50%; background: #ef4444; border: 2px solid #fff; }
  .item.active .unread { border-color: #2563eb; }
  @keyframes blink { 50% { opacity: .35; } }
  .item .t { flex: 1; min-width: 0; }
  .item b { display: block; font-size: 13px; font-weight: 600; }
  .item span { font-size: 11px; color: #6b7280; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.active span { color: #dbeafe; }
  .badge { margin-left: auto; background: #ef4444; color: #fff; border-radius: 9px; font-size: 10px; line-height: 16px; min-width: 17px; height: 17px; padding: 0 5px; text-align: center; font-weight: 700; flex-shrink: 0; }
  .cnt { font-size: 11px; background: #e5e7eb; border-radius: 9px; padding: 1px 7px; }
  .item .more { border: 0; background: transparent; color: #6b7280; font-size: 17px; line-height: 1; cursor: pointer; padding: 0 4px; border-radius: 6px; }
  .item .more:hover { background: rgba(0,0,0,.08); color: #111827; }
  .item.active .more { color: #dbeafe; }
  #roomMenu { display: none; position: fixed; z-index: 55; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 5px; min-width: 130px; }
  #roomMenu div { padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #roomMenu div:hover { background: #f3f4f6; }
  /* 主区 */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(255,255,255,.52); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,.8); position: relative; }
  #head .title { font-weight: 700; font-size: 15px; }
  #head .peers { font-size: 12px; color: #6b7280; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #groupBtn { border: 1px solid #d1d5db; background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #groupBtn:hover { background: #f9fafb; }
  #chatPlus { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #d1d5db; background: #fff; font-size: 17px; line-height: 1; cursor: pointer; color: #374151; }
  #chatPlus:hover { background: #f3f4f6; }
  #chatMenu { display: none; position: absolute; right: 12px; top: 46px; z-index: 45; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 5px; min-width: 130px; }
  #chatMenu div { padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #chatMenu div:hover { background: #f3f4f6; }
  #selbar button#doFwd.danger { background: #dc2626; border-color: #dc2626; }
  #netTag { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #dcfce7; color: #166534; }
  #netTag.off { background: #fee2e2; color: #991b1b; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px 20px; background: rgba(255,255,255,.28); }
  .row { display: flex; gap: 9px; margin-bottom: 12px; align-items: flex-start; }
  .row .ava { width: 32px; height: 32px; font-size: 14px; }
  .msg { max-width: 74%; padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: 11px; opacity: .65; margin-bottom: 3px; }
  .msg .t { font-size: 10px; opacity: .6; text-align: right; margin-top: 3px; }
  .row.user { flex-direction: row-reverse; }
  .row.user .msg { background: #2563eb; color: #fff; }
  .row.system { justify-content: center; }
  .row.system .msg { background: transparent; color: #9ca3af; font-size: 12px; padding: 2px; }
  #inputbar { display: flex; gap: 8px; padding: 12px 16px; background: rgba(255,255,255,.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid rgba(255,255,255,.8); position: relative; }
  #pendingWrap { display: none; padding: 8px 16px; background: rgba(255,255,255,.45); border-top: 1px solid rgba(255,255,255,.8); }
  .pendingItem { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 5px 10px; font-size: 12px; max-width: 100%; }
  .pendingItem img { height: 46px; border-radius: 6px; display: block; }
  .pendingItem button { border: 0; background: transparent; cursor: pointer; color: #9ca3af; font-size: 14px; }
  .pendingItem button:hover { color: #dc2626; }
  #attachBtn { width: 38px; border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.85); border-radius: 10px; font-size: 18px; cursor: pointer; color: #374151; }
  #attachBtn:hover { background: #fff; }
  #attachMenu { display: none; position: absolute; left: 16px; bottom: 62px; z-index: 50; background: rgba(255,255,255,.97); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; box-shadow: 0 10px 24px rgba(17,24,39,.18); padding: 5px; min-width: 130px; }
  #attachMenu div { padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #attachMenu div:hover { background: rgba(0,0,0,.06); }
  #emojiPanel { display: none; position: absolute; left: 16px; bottom: 62px; z-index: 50; width: 300px; background: rgba(255,255,255,.97); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; box-shadow: 0 10px 24px rgba(17,24,39,.18); padding: 8px; flex-wrap: wrap; gap: 4px; }
  #emojiPanel.on { display: flex; }
  #emojiPanel span { font-size: 20px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; }
  #emojiPanel span:hover { background: rgba(0,0,0,.08); }
  #mentionPop { display: none; position: absolute; left: 62px; bottom: 62px; z-index: 60; min-width: 180px; max-height: 230px; overflow-y: auto;
                background: rgba(255,255,255,.98); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; box-shadow: 0 10px 24px rgba(17,24,39,.18); padding: 5px; }
  #mentionPop div.mentionItem { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #mentionPop div.mentionItem.on { background: rgba(37,99,235,.14); }
  #mentionPop div.mentionItem .mm2 { color: #9ca3af; font-size: 11px; margin-left: auto; }
  #in { flex: 1; padding: 10px 12px; border: 1px solid rgba(0,0,0,.12); border-radius: 10px; font-size: 14px; outline: none; background: rgba(255,255,255,.8); }
  #in:focus { border-color: #2563eb; background: #fff; }
  #send { padding: 0 22px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  #hint { font-size: 11px; color: #6b7280; padding: 6px 16px 8px; background: rgba(255,255,255,.4); }
  /* 转发相关 */
  #selbar { display: none; align-items: center; gap: 10px; padding: 8px 16px; background: rgba(219,234,254,.75); backdrop-filter: blur(12px); border-top: 1px solid rgba(191,219,254,.9); font-size: 13px; }
  #selbar.on { display: flex; }
  #selbar button { padding: 5px 12px; border-radius: 7px; border: 1px solid #bfdbfe; background: #fff; cursor: pointer; font-size: 12px; }
  #selbar button#doFwd { background: #2563eb; color: #fff; border-color: #2563eb; }
  .row.sel { outline: 2px solid #2563eb; border-radius: 12px; }
  .pick { align-self: center; width: 18px; height: 18px; border: 2px solid #9ca3af; border-radius: 50%; flex-shrink: 0; cursor: pointer; }
  .row.sel .pick { background: #2563eb; border-color: #2563eb; }
  .row.user .pick { order: -1; }
  .fwd .quote { margin-top: 6px; border-left: 3px solid rgba(0,0,0,.18); padding: 6px 10px; background: rgba(255,255,255,.55); border-radius: 6px; font-size: 13px; }
  .fwd .qhead { font-size: 11px; color: #6b7280; margin-bottom: 3px; }
  .fwd .comment { font-size: 14px; }
  /* 右键菜单 */
  #menu { position: fixed; z-index: 50; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 5px; display: none; min-width: 160px; }
  #menu div { padding: 7px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #menu div:hover { background: #f3f4f6; }
  #menu div.sep { height: 1px; padding: 0; margin: 4px 0; background: #e5e7eb; cursor: default; }
  /* 群聊选择弹窗 */
  #modal { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: none; align-items: center; justify-content: center; z-index: 60; }
  #modal .box { background: #fff; border-radius: 14px; padding: 18px; width: 420px; max-width: 92vw; max-height: 80vh; overflow-y: auto; }
  #modal h3 { font-size: 15px; margin-bottom: 12px; }
  #modal .grp { margin-bottom: 16px; }
  #modal .grp h4 { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
  #modal label { display: flex; align-items: center; gap: 8px; padding: 5px 4px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #modal label:hover { background: #f9fafb; }
  #modal .foot { text-align: right; margin-top: 6px; }
  #modal button { padding: 8px 16px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 13px; }
  #modal button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .mrow { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
  .mrow span:first-child { flex: 1; }
  .mrow .mm { color: #9ca3af; font-size: 11px; }
  .mrow button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #e5e7eb; background: #fff; cursor: pointer; font-size: 13px; line-height: 1; }
  .mrow button.x { color: #dc2626; }
  .mrow button.a { color: #2563eb; }
  #modal .mrow button:disabled { opacity: .3; cursor: default; }
  .empty { font-size: 13px; color: #9ca3af; padding: 6px 4px; }
  .confirmbar { margin-top: 12px; padding: 10px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; font-size: 13px; }
  .confirmbar:empty { display: none; }
  /* 必须带 #modal 前缀：否则会被 `#modal button` 的 ID 优先级压过，白字白底看不见 */
  #modal .confirmbar button { padding: 6px 12px; border-radius: 7px; border: 1px solid #d1d5db; background: #fff; color: #1f2937; cursor: pointer; font-size: 12px; }
  #modal .confirmbar button.danger { background: #dc2626; border-color: #dc2626; color: #fff; }
</style>
</head>
<body>
  <div id="side">
    <div id="sideHead"><b id="appTitle" title="点击重命名">圆桌</b><button id="plusBtn" title="新建 / 添加">＋</button></div>
    <div id="plusMenu">
      <div data-act="group">💬 新建群聊</div>
      <div data-act="member">🤖 添加模型</div>
      <div data-act="search">🔍 搜索</div>
      <div data-act="delmember">🚫 删除模型</div>
    </div>
    <div id="sideScroll">
      <div class="sec">群聊</div>
      <div id="groups"></div>
      <div class="sec">联系人</div>
      <div id="contacts"></div>
    </div>
    <div id="sideFoot">
      <button id="setBtn">⚙ 设置</button>
      <div id="setMenu">
        <div data-sact="backup">📦 生成备份</div>
        <div data-sact="import">📥 导入备份</div>
      </div>
    </div>
  </div>
  <div id="main">
    <div id="head">
      <div class="title" id="title">—</div>
      <div class="peers" id="peers"></div>
      <div id="netTag">🌐 在线</div>
      <button id="chatPlus">＋</button>
      <div id="chatMenu">
        <div id="cmMembers" data-cact="members">👥 群成员</div>
        <div data-cact="forward">↪ 转发对话</div>
        <div data-cact="delete">🗑 删除对话</div>
        <div data-cact="settings">⚙ 设置</div>
      </div>
    </div>
    <div id="msgs"></div>
    <div id="selbar"><span>已选 <b id="selcount">0</b> 条</span><button id="doFwd">转发…</button><button id="cancelSel">取消</button></div>
    <div id="pendingWrap"></div>
    <div id="inputbar">
      <button id="attachBtn" title="发送表情 / 图片 / 视频 / 文件">＋</button>
      <div id="attachMenu">
        <div data-a="emoji">😊 表情</div>
        <div data-a="image">🖼 图片</div>
        <div data-a="video">🎬 视频</div>
        <div data-a="file">📁 文件</div>
      </div>
      <div id="emojiPanel"></div>
      <div id="mentionPop"></div>
      <input id="in" placeholder="说点什么…（输入 @ 选择成员）" autocomplete="off">
      <button id="send">发送</button>
      <input type="file" id="pickImage" accept="image/*" style="display:none">
      <input type="file" id="pickVideo" accept="video/*" style="display:none">
      <input type="file" id="pickFile" style="display:none">
    </div>
  </div>
  <div id="menu"></div>
  <div id="roomMenu"></div>
  <div id="modal"><div class="box" id="modalBox"></div></div>
<script>
const COLORS = ['#fde68a','#fbcfe8','#a7f3d0','#ddd6fe','#bae6fd','#fed7aa'];
const $ = (id) => document.getElementById(id);
const msgs = $('msgs'), inp = $('in');
let M = [], rooms = {}, states = {}, netOnline = true, active = 'free', colorMap = {}, streaming = {}, mdom = {}, maxR = 6;
let unread = {};   // 未读条数：{ 'dm:kimi': 2, free: 3 } —— 对应微信的红点/角标
let roomSettings = {}, histDefault = 6000;   // 每个会话独立设置（上下文长度）
let loading = false, pendingRows = [], loadSeq = 0;   // 切房间时的加载窗口：先缓存实时消息，加载完再补画

const colorOf = (n) => colorMap[n] ??= COLORS[Object.keys(colorMap).length % COLORS.length];
const hhmm = (ts) => new Date(ts || Date.now()).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ava = (name) => `<div class="ava" style="background:${colorOf(name)}">${esc(name[0])}</div>`;
function attachHtml(a){
  if (!a) return '';
  const mime = a.mime || '';
  if (a.kind === 'image' || mime.startsWith('image/')) return `<div style="margin-top:6px"><img src="${esc(a.url)}" style="max-width:260px;max-height:260px;border-radius:8px;display:block"></div>`;
  if (a.kind === 'video' || mime.startsWith('video/')) return `<div style="margin-top:6px"><video src="${esc(a.url)}" controls style="max-width:320px;max-height:240px;border-radius:8px;display:block"></video></div>`;
  return `<div style="margin-top:6px"><a href="${esc(a.url)}" download="${esc(a.name)}" target="_blank" style="color:#2563eb;text-decoration:underline">📎 ${esc(a.name)}</a></div>`;
}
const memberById = (id) => M.find(m => m.id === id);
const isOff = (m) => { const st = states[m.id] || {}; return !!st.down || (!netOnline && m.provider !== 'qwen3-8b'); };

function roomMembers(roomId){
  if (roomId.startsWith('dm:')) { const m = memberById(roomId.slice(3)); return m ? [m] : []; }
  return (rooms[roomId]?.members || []).map(memberById).filter(Boolean);
}
function roomName(roomId){
  if (roomId.startsWith('dm:')) return memberById(roomId.slice(3))?.name ?? '私聊';
  return rooms[roomId]?.name ?? roomId;
}

// ---------- 侧栏 ----------
function renderSide(){
  $('groups').innerHTML = '';
  const gids = ['work', 'free', ...Object.keys(rooms).filter(k => k !== 'work' && k !== 'free')]
    .filter(k => rooms[k])
    .sort((a, b) => (rooms[b].pinned ? 1 : 0) - (rooms[a].pinned ? 1 : 0));   // 置顶的排前面
  for (const gid of gids) {
    const r = rooms[gid];
    const d = document.createElement('div');
    d.className = 'item' + (active === gid ? ' active' : '');
    d.innerHTML = `<div class="ava" style="background:#dbeafe">群</div><div class="t"><b>${r.pinned ? '📌' : ''}${esc(r.name)}</b><span>${r.members.length} 位成员</span></div><button class="more" title="更多">⋯</button>`;
    if (unread[gid]) d.insertAdjacentHTML('beforeend', `<span class="badge">${unread[gid] > 99 ? '99+' : unread[gid]}</span>`);
    d.onclick = () => openRoom(gid);
    d.querySelector('.more').onclick = (e) => { e.stopPropagation(); openRoomMenu(e, gid); };
    $('groups').appendChild(d);
  }
  $('contacts').innerHTML = '';
  mdom = {};
  for (const m of M) {
    const d = document.createElement('div');
    d.className = 'item' + (active === 'dm:' + m.id ? ' active' : '') + (isOff(m) ? ' off' : '');
    d.innerHTML = `${ava(m.name)}<div class="t"><b>${esc(m.name)}</b><span>${esc(m.model)}${m.persona ? ' · 🎭' + esc(m.persona) : ''}</span></div>`;
    const dot = document.createElement('i');
    const st = states[m.id] || {};
    dot.className = 'dot' + (isOff(m) ? ' off' : st.speaking ? ' typing' : '');
    d.querySelector('.ava').appendChild(dot);
    mdom[m.id] = dot;
    const n = unread['dm:' + m.id];
    if (n) {
      d.querySelector('.ava').insertAdjacentHTML('beforeend', '<i class="unread"></i>');
      d.insertAdjacentHTML('beforeend', `<span class="badge">${n > 99 ? '99+' : n}</span>`);
    }
    d.onclick = () => openRoom('dm:' + m.id);
    $('contacts').appendChild(d);
  }
}
function paint(m){ const dot = mdom[m.id]; if (!dot) return; const st = states[m.id] || {}; dot.className = 'dot' + (isOff(m) ? ' off' : st.speaking ? ' typing' : ''); }

// ---------- 消息 ----------
function msgRow(rec){
  if (rec.id && document.getElementById(rec.id)) return null;   // 幂等：同一条不画两次
  const row = document.createElement('div');
  row.className = 'row ' + (rec.kind === 'user' ? 'user' : rec.kind === 'system' ? 'system' : '');
  row.id = rec.id;
  if (rec.kind === 'member') row.innerHTML = `${ava(rec.from)}<div class="msg" style="background:${colorOf(rec.from)}"><div class="who">${esc(rec.from)} · ${hhmm(rec.ts)}</div><div class="body">${esc(rec.text)}</div></div>`;
  else if (rec.kind === 'user') row.innerHTML = `<div class="msg">${rec.text ? `<div class="body">${esc(rec.text)}</div>` : ''}${attachHtml(rec.attach)}<div class="t">${hhmm(rec.ts)}</div></div>`;
  else if (rec.kind === 'forward') {
    const items = (rec.forward?.items || []).map(it => {
      const t = new Date(it.ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      return `<div class="quote"><div class="qhead">转发自 ${esc(it.chain.map(roomName).join(' → '))} · ${esc(it.from)} · ${t}</div><div>${esc(it.text)}</div></div>`;
    }).join('');
    row.innerHTML = `<div class="msg fwd" style="background:#eef2ff"><div class="who">你 · 转发 · ${hhmm(rec.ts)}</div>${rec.text ? `<div class="comment">${esc(rec.text)}</div>` : ''}${items}</div>`;
  }
  else row.innerHTML = `<div class="msg">${esc(rec.text)}</div>`;
  if (selectMode && rec.kind !== 'system') {
    row.insertAdjacentHTML('afterbegin', '<div class="pick"></div>');
    if (selected.has(rec.id)) row.classList.add('sel');
  }
  msgs.appendChild(row); msgs.scrollTop = msgs.scrollHeight;
  return row;
}
async function openRoom(id){
  active = id;
  delete unread[id];                                  // 打开即清红点
  if (typeof closeMention === 'function') closeMention();
  const list = roomMembers(id);
  $('title').textContent = roomName(id);
  $('peers').textContent = id.startsWith('dm:') ? (list[0]?.model ?? '') : list.map(m => m.name).join('、');
  $('cmMembers').style.display = id.startsWith('dm:') ? 'none' : '';   // 群成员项只在群里出现
  renderSide();
  const token = ++loadSeq;
  loading = true; pendingRows = [];
  const r = await fetch('/api/messages?room=' + encodeURIComponent(id)).then(x => x.json());
  if (token !== loadSeq) return;                      // 期间又切了房间，放弃这次渲染
  msgs.innerHTML = '';
  r.messages.forEach(msgRow);
  loading = false;
  pendingRows.forEach(msgRow);                        // 补画加载期间到达的消息
  pendingRows = [];
}

let selectMode = false, selected = new Set(), selPurpose = 'forward';
function setSelectMode(on){
  selectMode = on;
  selected.clear();
  $('selbar').classList.toggle('on', on);
  refreshPickUI();
}
function startSelection(purpose){ selPurpose = purpose; setSelectMode(true); updateSelbar(); }
function updateSelbar(){
  const isDel = selPurpose === 'delete';
  $('doFwd').textContent = isDel ? '删除所选' : '转发…';
  $('doFwd').classList.toggle('danger', isDel);

function refreshPickUI(){
  for (const row of msgs.querySelectorAll('.row')) {
    if (row.classList.contains('system')) continue;
    const has = row.querySelector('.pick');
    if (selectMode && !has) row.insertAdjacentHTML('afterbegin', '<div class="pick"></div>');
    if (!selectMode && has) has.remove();
    row.classList.toggle('sel', selectMode && selected.has(row.id));
  }
  $('selcount').textContent = String(selected.size);
}
msgs.addEventListener('click', (e) => {

});

    <button class="primary" id="optClear" style="width:100%;padding:12px;margin-bottom:8px">🧹 清空对话（保留${roomId.startsWith('dm:') ? '聊天' : '群'}，只删记录）</button>
    <div style="font-size:11px;color:#9ca3af;margin-top:6px">${isCustom ? '' : '「工作模式 / 自由模式」是内置群，只能清空记录，不能删除群本身。'}</div>`;
  $('modal').style.display = 'flex';

  if (isCustom) $('optRoom').onclick = () => askConfirm('确认删除该群',
    `群聊「${esc(name)}」及其全部聊天记录将被永久删除。`, true,
    async () => {
      const r = await fetch('/api/rooms/clear', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room: roomId, deleteRoom: true }) }).then(x => x.json());
      $('modal').style.display = 'none';
      if (!r.ok) return alert('删除失败：' + (r.error || '未知'));
      delete rooms[roomId]; renderSide();
      if (active === roomId) openRoom('free');
    });

  $('optClear').onclick = () => askConfirm('确认清空对话',
    `「${esc(name)}」的全部聊天记录将被删除，${roomId.startsWith('dm:') ? '聊天本身' : '群聊本身'}保留。`, true,
    async () => {

      if (active === roomId) msgs.innerHTML = '';

          ${Object.keys(rooms).filter(k => rooms[k]).map(k => `<option value="${k}">群 · ${esc(rooms[k].name)}</option>`).join('')}
          ${M.map(m => `<option value="dm:${m.id}">私聊 · ${esc(m.name)}</option>`).join('')}

      $('impGo').onclick = () => runImport(backupData, box);

      $('bkFileInfo').innerHTML = `<span style="color:#dc2626">读取失败：${esc(err.message)}</span>`;

async function runImport(data, box){
  const picks = [...box.querySelectorAll('.impRoom:checked')].map(c => +c.value);
  if (!picks.length) { alert('至少选一个要导入的会话'); return; }
  const keys = Object.keys(data.rooms || {});
  const sources = picks.map(i => ({ name: data.rooms[keys[i]].name, messages: data.rooms[keys[i]].messages || [] }));
  let target = $('impTarget').value;
  if (target === '__new__') {
    const name = '导入-' + new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    const r = await fetch('/api/rooms/create', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, members: M.map(m => m.id) }) }).then(x => x.json());
    if (!r.ok) { alert('创建群失败'); return; }
    rooms[r.id] = { name, members: M.map(m => m.id) };
    target = r.id;
    renderSide();
  }
  $('impGo').disabled = true; $('impGo').textContent = '导入中…';
  const r = await fetch('/api/backup/import', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ target, sources }) }).then(x => x.json());
  if ($('impGo')) { $('impGo').disabled = false; $('impGo').textContent = '开始导入'; }
  if (r.ok) {
    $('impResult').innerHTML = `✅ 已导入 ${r.count} 条到「${esc(roomName(target))}」`;
    if (active === target) openRoom(target);
  } else {
    $('impResult').innerHTML = `<span style="color:#dc2626">导入失败：${esc(r.error || '未知')}</span>`;
  }
}

let pendingAttach = null;   // 已上传、待随下一条消息一起发送的附件
function renderPending(){
  const w = $('pendingWrap');
  if (!pendingAttach) { w.style.display = 'none'; w.innerHTML = ''; return; }
  const a = pendingAttach;
  w.style.display = 'block';
  const thumb = a.kind === 'image' ? `<img src="${esc(a.url)}">` : a.kind === 'video' ? '🎬' : '📎';
  w.innerHTML = `<div class="pendingItem">${thumb}<span>${esc(a.name)}</span><button id="pendDel" title="移除">✕</button></div>`;
  $('pendDel').onclick = () => { pendingAttach = null; renderPending(); };
}
async function prepareAttach(file, kind){
  if (file.size > 20 * 1024 * 1024) { alert('文件超过 20MB'); return; }
  $('attachBtn').disabled = true; $('attachBtn').textContent = '…';
  try {
    const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
    const base64 = String(dataUrl).split(',')[1] || '';
    const up = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: file.name, mime: file.type, data: base64 }) }).then(r => r.json());
    if (!up.ok) { alert('上传失败：' + (up.error || '未知')); return; }
    pendingAttach = { url: up.url, name: up.name, mime: up.mime, kind };
    renderPending();
    $('in').focus();                       // 上传完回到输入框，接着写你要说的话
  } catch (err) { alert('上传失败：' + err.message); }
  finally { $('attachBtn').disabled = false; $('attachBtn').textContent = '＋'; }
}

// ---------- @ 成员选择（微信式） ----------
let mentionItems = [], mentionIdx = 0, mentionStart = -1;
function closeMention(){ $('mentionPop').style.display = 'none'; mentionItems = []; mentionStart = -1; }
function updateMention(){
  const v = inp.value, pos = inp.selectionStart ?? v.length;
  const before = v.slice(0, pos);
  const m = /@([^\s@]{0,12})$/.exec(before);
  if (!m) return closeMention();
  const q = m[1].toLowerCase();
  const list = roomMembers(active).filter(x => !q || x.name.toLowerCase().includes(q) || String(x.model).toLowerCase().includes(q));
  if (!list.length) return closeMention();
  mentionItems = list.slice(0, 8);
  mentionStart = pos - m[0].length;
  mentionIdx = 0;
  const pop = $('mentionPop');
  pop.innerHTML = mentionItems.map((x, i) =>
    `<div class="mentionItem${i === 0 ? ' on' : ''}" data-i="${i}"><b>${esc(x.name)}</b><span class="mm2">${esc(x.model)}</span></div>`).join('');
  pop.style.display = 'block';
  pop.querySelectorAll('.mentionItem').forEach(d => {
    d.onmousedown = (e) => { e.preventDefault(); pickMention(+d.dataset.i); };
  });
}
function paintMention(){
  $('mentionPop').querySelectorAll('.mentionItem').forEach((d, i) => d.classList.toggle('on', i === mentionIdx));
}
function pickMention(i){
  const it = mentionItems[i];
  if (!it) return closeMention();
  const v = inp.value, pos = inp.selectionStart ?? v.length;
  const head = v.slice(0, mentionStart);
  const tail = v.slice(pos);
  const insert = '@' + it.name + ' ';
  inp.value = head + insert + tail;
  const np = head.length + insert.length;
  inp.setSelectionRange(np, np);
  inp.focus();
  closeMention();
}
inp.addEventListener('input', updateMention);
inp.addEventListener('click', updateMention);
inp.onkeydown = (e) => {
  const open = $('mentionPop').style.display === 'block';
  if (open) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      mentionIdx = (mentionIdx + (e.key === 'ArrowDown' ? 1 : -1) + mentionItems.length) % mentionItems.length;
      paintMention();
      return;
    }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(mentionIdx); return; }
    if (e.key === 'Escape') { e.preventDefault(); closeMention(); return; }
  }
  if (e.key === 'Enter') send();
};

// ---------- 启动 + SSE ----------
fetch('/api/state').then(r => r.json()).then(s => {
  M = s.members; rooms = s.rooms; states = s.states || {}; netOnline = s.netOnline !== false; maxR = s.maxRounds;
  roomSettings = s.settings || {}; histDefault = s.histDefault || 6000;
  if (s.appTitle) { $('appTitle').textContent = s.appTitle; document.title = s.appTitle + ' · 多模型聊天'; }
  setNet(netOnline);
  renderSide();
  openRoom('free');
});
const es = new EventSource('/api/events');
es.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'msg') {
    if (ev.rec.room === active) { if (loading) pendingRows.push(ev.rec); else msgRow(ev.rec); }
    return;
  }
  if (ev.type === 'status') { states[ev.id] = { down: ev.down, speaking: ev.speaking }; const m = memberById(ev.id); if (m) paint(m); return; }
  if (ev.type === 'net') { setNet(ev.online); return; }
  if (ev.type === 'rooms') { rooms = ev.rooms; renderSide(); return; }
  if (ev.type === 'app') { $('appTitle').textContent = ev.title; document.title = ev.title + ' · 多模型聊天'; return; }
  if (ev.type === 'members') { M = ev.members.filter((m, i, a) => a.findIndex(x => x.id === m.id) === i); renderSide(); return; }
  if (ev.type === 'cleared') { if (ev.room === active) msgs.innerHTML = ''; delete unread[ev.room]; renderSide(); return; }
  if (ev.type === 'imported') { if (ev.room === active) openRoom(ev.room); return; }
  if (ev.type === 'deleted') {    if (ev.room === active) {
      const firstRow = ev.ids.map(id => document.getElementById(id)).filter(Boolean)[0];
      const anchor = firstRow ? firstRow.nextSibling : null;
      ev.ids.forEach(id => document.getElementById(id)?.remove());
      if (ev.notice) { const row = msgRow(ev.notice); if (row) msgs.insertBefore(row, anchor); }   // 留痕插回原位置
    }
    return;
  }
  if (ev.type === 'start' && ev.room === active) {
    if (loading) return;                              // 加载窗口内不建流式行，等 end 事件补画
    const row = document.createElement('div');
    row.className = 'row'; row.id = ev.id;
    row.innerHTML = `${ava(ev.from)}<div class="msg" style="background:${colorOf(ev.from)}"><div class="who">${esc(ev.from)} · ${hhmm()}</div><div class="body">…</div></div>`;
    msgs.appendChild(row); msgs.scrollTop = msgs.scrollHeight; streaming[ev.id] = row; return;
  }
  if (ev.type === 'delta' && streaming[ev.id]) { const b = streaming[ev.id].querySelector('.body'); if (b.textContent === '…') b.textContent = ''; b.textContent += ev.text; msgs.scrollTop = msgs.scrollHeight; return; }
  if (ev.type === 'end') {
    const row = streaming[ev.id];
    if (ev.room === active) {
      if (row) { if (ev.rec) row.querySelector('.body').textContent = ev.rec.text; }
      else if (ev.rec && !loading) msgRow(ev.rec);   // 中途切进来时补画（加载窗口内交给 pendingRows）
      delete streaming[ev.id];
    } else if (ev.rec) { unread[ev.room] = (unread[ev.room] || 0) + 1; renderSide(); }
  }
};
</script>
</body>
</html>
