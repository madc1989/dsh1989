<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>圆桌 · 多模型聊天</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; height: 100vh; display: flex; color: var(--ink); overflow: hidden;
         background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 35%, #fce7f3 65%, #fef3c7 100%); background-attachment: fixed; }
  /* 左侧栏：与右侧同一套半透明玻璃 */
  #side { width: 230px; padding: 12px 8px 6px; flex-shrink: 0; position: relative; color: var(--ink); display: flex; flex-direction: column;
          background: rgba(255,255,255,.52); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
          border-right: 1px solid rgba(255,255,255,.8); }
  #sideScroll { flex: 1; overflow-y: auto; min-height: 0; }
  #sideFoot { padding: 6px 2px 0; border-top: 1px solid rgba(255,255,255,.85); margin-top: 4px; }
  #setBtn { width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 13px; }
  #setBtn:hover { background: rgba(255,255,255,.75); }
  #setMenu { display: none; position: absolute; left: 10px; bottom: 46px; z-index: 45; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; box-shadow: 0 10px 24px rgba(17,24,39,.18); padding: 5px; min-width: 140px; }
  #setMenu div { padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #setMenu div:hover { background: rgba(0,0,0,.06); }
  #sideHead { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 6px; }
  #sideHead b { font-size: 15px; cursor: pointer; border-radius: 6px; padding: 2px 4px; }
  #sideHead b:hover { background: rgba(255,255,255,.8); }
  #plusBtn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.65); color: var(--ink-2); font-size: 16px; line-height: 1; cursor: pointer; }
  #plusBtn:hover { background: rgba(255,255,255,.95); }
  #plusMenu { display: none; position: absolute; right: 10px; top: 44px; z-index: 40; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; padding: 5px; min-width: 140px; box-shadow: 0 10px 24px rgba(17,24,39,.18); }
  #plusMenu div { padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #plusMenu div:hover { background: rgba(0,0,0,.06); }
  .sec { font-size: 11px; color: var(--ink-3); padding: 10px 8px 6px; letter-spacing: .5px; }
  .item { display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: 10px; cursor: pointer; margin-bottom: 3px; }
  .item:hover { background: rgba(255,255,255,.7); }
  .item.active { background: var(--focus); color: #fff; }
  .item.off { opacity: .45; }
  .ava { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--ink); flex-shrink: 0; position: relative; }
  .dot { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; background: #22c55e; }
  .dot.off { background: var(--ink-3); }
  .dot.typing { background: #f59e0b; animation: blink 1s infinite; }
  .unread { position: absolute; right: -1px; top: -1px; width: 9px; height: 9px; border-radius: 50%; background: #ef4444; border: 2px solid #fff; }
  .item.active .unread { border-color: var(--focus); }
  @keyframes blink { 50% { opacity: .35; } }
  .item .t { flex: 1; min-width: 0; }
  .item b { display: block; font-size: 13px; font-weight: 600; }
  .item span { font-size: 11px; color: var(--ink-3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.active span { color: #dbeafe; }
  .badge { margin-left: auto; background: #ef4444; color: #fff; border-radius: 9px; font-size: 10px; line-height: 16px; min-width: 17px; height: 17px; padding: 0 5px; text-align: center; font-weight: 700; flex-shrink: 0; }
  .cnt { font-size: 11px; background: var(--line); border-radius: 9px; padding: 1px 7px; }
  .item .more { border: 0; background: transparent; color: var(--ink-3); font-size: 17px; line-height: 1; cursor: pointer; padding: 0 4px; border-radius: 6px; }
  .item .more:hover { background: rgba(0,0,0,.08); color: var(--ink); }
  .item.active .more { color: #dbeafe; }
  #roomMenu { display: none; position: fixed; z-index: 55; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 5px; min-width: 130px; }
  #roomMenu div { padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #roomMenu div:hover { background: var(--bg); }
  /* 主区 */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  /* z-index 必须给：backdrop-filter 让 #head 自成层叠上下文，#statusbar 又是它后面的兄弟，
     不给就轮到后面的状态条盖住 #head 里弹出的 #chatMenu（2026-10-20 实测「+ 菜单被挡住」） */
  #head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(255,255,255,.52); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,.8); position: relative; z-index: 50; }
  #head .title { font-weight: 700; font-size: 15px; }
  #head .peers { font-size: 12px; color: var(--ink-3); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #groupBtn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #groupBtn:hover { background: var(--surface-2); }
  #chatPlus { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 17px; line-height: 1; cursor: pointer; color: var(--ink-2); }
  #chatPlus:hover { background: var(--bg); }
  #chatMenu { display: none; position: absolute; right: 12px; top: 46px; z-index: 45; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 5px; min-width: 130px; }
  #chatMenu div { padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #chatMenu div:hover { background: var(--bg); }
  #selbar button#doFwd.danger { background: #dc2626; border-color: #dc2626; }
  #netTag { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #dcfce7; color: #166534; }
  #netTag.off { background: #fee2e2; color: #991b1b; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px 20px; background: rgba(255,255,255,.28); }
  .row { display: flex; gap: 9px; margin-bottom: 12px; align-items: flex-start; }
  .row .ava { width: 32px; height: 32px; font-size: 14px; }
  .msg { max-width: 74%; padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: 11px; opacity: .65; margin-bottom: 3px; }
  .msg .t { font-size: 10px; opacity: .6; text-align: right; margin-top: 3px; }
  .row.user { flex-direction: row-reverse; }
  .row.user .msg { background: var(--focus); color: #fff; }
  .row.system { justify-content: center; }
  .row.system .msg { background: transparent; color: var(--ink-4); font-size: 12px; padding: 2px; }
  /* 状态条：模式 + 调用次数 + 暂停/结束 + 席位 + 在场 */
  #statusbar { padding: 8px 16px 9px; background: rgba(255,255,255,.44); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,.8); }
  .sb-row { display: flex; align-items: center; gap: 8px; }
  #sbMode { font-size: 13px; color: var(--ink); }
  .sb-calls { font-size: 11px; color: var(--ink-3); }
  .sb-actions { margin-left: auto; display: flex; gap: 6px; }
  .sb-actions button { font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); cursor: pointer; }
  .sb-actions button:hover { background: var(--surface-2); }
  .sb-actions button.danger { border-color: #fca5a5; color: #b91c1c; }
  .sb-actions button.on { border-color: var(--focus); color: var(--focus); background: #eff6ff; }
  .sb-seats { display: flex; gap: 8px; margin-top: 8px; }
  .seat { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 10px;
          background: rgba(255,255,255,.55); border: 1px solid transparent; transition: transform .15s, box-shadow .15s, background .15s; }
  .seat.speaking { background: #fff; border-color: rgba(37,99,235,.35); box-shadow: 0 4px 14px rgba(37,99,235,.14); transform: translateY(-1px); }
  .seat.off { opacity: .45; }
  .seat .ava { width: 26px; height: 26px; font-size: 12px; }
  .seat .ava .dot { width: 8px; height: 8px; }
  .seat .st { min-width: 0; }
  .seat .st b { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat .st span { font-size: 11px; color: var(--ink-3); }
  .seat.speaking .st span { color: var(--focus); }
  .sb-presence { margin-top: 6px; flex-wrap: wrap; }
  .sb-label { font-size: 11px; color: var(--ink-3); }
  .pill { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.7); color: var(--ink-4); cursor: pointer; }
  .pill.on { border-color: rgba(37,99,235,.35); color: #1d4ed8; background: #eff6ff; }
  /* 模式 tab：放在输入框正上方 */
  #modeTabs { display: flex; gap: 6px; padding: 8px 16px 7px; background: rgba(255,255,255,.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid rgba(255,255,255,.8); }
  #modeTabs button { font-size: 12px; padding: 5px 13px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink-3); cursor: pointer; }
  #modeTabs button:hover { background: rgba(255,255,255,.85); }
  #modeTabs button.on { background: #fff; color: var(--ink); border-color: var(--line); font-weight: 600; box-shadow: 0 1px 3px rgba(17,24,39,.06); }
  #modeTabs .mt-hint { margin-left: auto; font-size: 11px; color: var(--ink-4); align-self: center; }
  .pfBlock { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: rgba(255,255,255,.6); }
  .pfBlock > summary { font-size: 12px; color: var(--ink-2); cursor: pointer; }
  .pfBlock[open] > summary { margin-bottom: 4px; }
  #inputbar { display: flex; gap: 8px; padding: 12px 16px; background: rgba(255,255,255,.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid rgba(255,255,255,.8); position: relative; }
  #pendingWrap { display: none; padding: 8px 16px; background: rgba(255,255,255,.45); border-top: 1px solid rgba(255,255,255,.8); }
  .pendingItem { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; font-size: 12px; max-width: 100%; }
  .pendingItem img { height: 46px; border-radius: 6px; display: block; }
  .pendingItem button { border: 0; background: transparent; cursor: pointer; color: var(--ink-4); font-size: 14px; }
  .pendingItem button:hover { color: #dc2626; }
  #attachBtn { width: 38px; border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.85); border-radius: 10px; font-size: 18px; cursor: pointer; color: var(--ink-2); }
  #attachBtn:hover { background: #fff; }
  #attachMenu { display: none; position: absolute; left: 16px; bottom: 62px; z-index: 50; background: rgba(255,255,255,.97); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; box-shadow: 0 10px 24px rgba(17,24,39,.18); padding: 5px; min-width: 130px; }
  #attachMenu div { padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #attachMenu div:hover { background: rgba(0,0,0,.06); }
  #emojiPanel { display: none; position: absolute; left: 16px; bottom: 62px; z-index: 50; width: 300px; background: rgba(255,255,255,.97); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; box-shadow: 0 10px 24px rgba(17,24,39,.18); padding: 8px; flex-wrap: wrap; gap: 4px; }
  #emojiPanel.on { display: flex; }
  #emojiPanel span { font-size: 20px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; }
  #emojiPanel span:hover { background: rgba(0,0,0,.08); }
  #mentionPop { display: none; position: absolute; left: 62px; bottom: 62px; z-index: 60; min-width: 180px; max-height: 230px; overflow-y: auto;
                background: rgba(255,255,255,.98); border: 1px solid rgba(0,0,0,.08); border-radius: 10px; box-shadow: 0 10px 24px rgba(17,24,39,.18); padding: 5px; }
  #mentionPop div.mentionItem { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #mentionPop div.mentionItem.on { background: rgba(37,99,235,.14); }
  #mentionPop div.mentionItem .mm2 { color: var(--ink-4); font-size: 11px; margin-left: auto; }
  #in { flex: 1; padding: 10px 12px; border: 1px solid rgba(0,0,0,.12); border-radius: 10px; font-size: 14px; outline: none; background: rgba(255,255,255,.8); }
  #in:focus { border-color: var(--focus); background: #fff; }
  #send { padding: 0 22px; border: 0; border-radius: 10px; background: var(--focus); color: #fff; font-size: 14px; cursor: pointer; }
  #hint { font-size: 11px; color: var(--ink-3); padding: 6px 16px 8px; background: rgba(255,255,255,.4); }
  /* 转发相关 */
  #selbar { display: none; align-items: center; gap: 10px; padding: 8px 16px; background: rgba(219,234,254,.75); backdrop-filter: blur(12px); border-top: 1px solid rgba(191,219,254,.9); font-size: 13px; }
  #selbar.on { display: flex; }
  #selbar button { padding: 5px 12px; border-radius: 7px; border: 1px solid #bfdbfe; background: #fff; cursor: pointer; font-size: 12px; }
  #selbar button#doFwd { background: var(--focus); color: #fff; border-color: var(--focus); }
  .row.sel { outline: 2px solid var(--focus); border-radius: 12px; }
  .pick { align-self: center; width: 18px; height: 18px; border: 2px solid var(--ink-4); border-radius: 50%; flex-shrink: 0; cursor: pointer; }
  .row.sel .pick { background: var(--focus); border-color: var(--focus); }
  .row.user .pick { order: -1; }
  .fwd .quote { margin-top: 6px; border-left: 3px solid rgba(0,0,0,.18); padding: 6px 10px; background: rgba(255,255,255,.55); border-radius: 6px; font-size: 13px; }
  .fwd .qhead { font-size: 11px; color: var(--ink-3); margin-bottom: 3px; }
  .fwd .comment { font-size: 14px; }
  /* 右键菜单 */
  #menu { position: fixed; z-index: 50; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 5px; display: none; min-width: 160px; }
  #menu div { padding: 7px 10px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #menu div:hover { background: var(--bg); }
  #menu div.sep { height: 1px; padding: 0; margin: 4px 0; background: var(--line); cursor: default; }
  /* 群聊选择弹窗 */
  #modal { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: none; align-items: center; justify-content: center; z-index: 60; }
  #modal .box { background: #fff; border-radius: 14px; padding: 18px; width: 420px; max-width: 92vw; max-height: 80vh; overflow-y: auto; }
  #modal h3 { font-size: 15px; margin-bottom: 12px; }
  #modal .grp { margin-bottom: 16px; }
  #modal .grp h4 { font-size: 13px; color: var(--ink-3); margin-bottom: 8px; }
  #modal label { display: flex; align-items: center; gap: 8px; padding: 5px 4px; font-size: 13px; border-radius: 7px; cursor: pointer; }
  #modal label:hover { background: var(--surface-2); }
  #modal .foot { text-align: right; margin-top: 6px; }
  #modal button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; }
  #modal button.primary { background: var(--focus); color: #fff; border-color: var(--focus); }
  .mrow { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--bg); font-size: 13px; }
  .mrow span:first-child { flex: 1; }
  .mrow .mm { color: var(--ink-4); font-size: 11px; }
  .mrow button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; line-height: 1; }
  .mrow button.x { color: #dc2626; }
  .mrow button.a { color: var(--focus); }
  #modal .mrow button:disabled { opacity: .3; cursor: default; }
  .empty { font-size: 13px; color: var(--ink-4); padding: 6px 4px; }
  .confirmbar { margin-top: 12px; padding: 10px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; font-size: 13px; }
  .confirmbar:empty { display: none; }
  /* 必须带 #modal 前缀：否则会被 `#modal button` 的 ID 优先级压过，白字白底看不见 */
  #modal .confirmbar button { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; font-size: 12px; }
  #modal .confirmbar button.danger { background: #dc2626; border-color: #dc2626; color: #fff; }

  /* ===== 深色主题（对齐 DeepSeek Harness） ===== */
  body.dark { color: #e6e6e6; background-color: #17181c; }
  body.dark #side { background: #1e1f24; border-right-color: #2b2d34; color: #e6e6e6; }
  body.dark #sideHead b:hover { background: #2b2d34; }
  body.dark #plusBtn { background: #26272e; border-color: #33353d; color: #cfd2d9; }
  body.dark #plusBtn:hover, body.dark #chatPlus:hover { background: #33353d; }
  body.dark #plusMenu, body.dark #chatMenu, body.dark #roomMenu, body.dark #setMenu,
  body.dark #attachMenu, body.dark #emojiPanel, body.dark #mentionPop { background: #24252b; border-color: #33353d; box-shadow: 0 10px 28px rgba(0,0,0,.5); color: #e6e6e6; }
  body.dark #plusMenu div:hover, body.dark #chatMenu div:hover, body.dark #roomMenu div:hover,
  body.dark #setMenu div:hover, body.dark #attachMenu div:hover, body.dark #emojiPanel span:hover,
  body.dark #mentionPop div.mentionItem.on { background: #33353d; }
  body.dark .sec { color: #8b8f99; }
  body.dark .item:hover { background: #26272e; }
  body.dark .item.active { background: #2f3a4d; color: #e6e6e6; }
  body.dark .item span, body.dark .item.active span { color: #9aa0aa; }
  body.dark .item .more { color: #8b8f99; }
  body.dark .item .more:hover { background: rgba(255,255,255,.1); color: #e6e6e6; }
  body.dark .dot, body.dark .unread { border-color: #1e1f24; }
  body.dark #setBtn { color: #cfd2d9; }
  body.dark #setBtn:hover { background: #26272e; }
  body.dark #sideFoot { border-top-color: #2b2d34; }
  body.dark #head { background: #1e1f24; border-bottom-color: #2b2d34; }
  body.dark #msgs { background: #17181c; }
  body.dark #inputbar { background: #1e1f24; border-top-color: #2b2d34; }
  body.dark #pendingWrap { background: #1e1f24; border-top-color: #2b2d34; }
  body.dark .pendingItem { background: #26272e; border-color: #33353d; color: #cfd2d9; }
  body.dark #in { background: #26272e; border-color: #33353d; color: #e6e6e6; }
  body.dark #in::placeholder { color: #767b85; }
  body.dark #in:focus { background: #2b2d34; border-color: #4d8dff; }
  body.dark #attachBtn { background: #26272e; border-color: #33353d; color: #cfd2d9; }
  body.dark #attachBtn:hover { background: #33353d; }
  /* 成员气泡保留各自浅色底，所以深色主题下文字必须用深色，否则白字白底看不清 */
  body.dark .msg { background: #24252b; color: var(--ink); }
  body.dark .msg.fwd { color: var(--ink); }
  body.dark .row.user .msg { background: #2b4a7a; color: #eaf1fb; }
  body.dark .row.system .msg { color: #8b8f99; background: transparent; }
  body.dark .msg .who, body.dark .msg .t { color: #4b5563; opacity: 1; }
  body.dark .row.user .msg .who, body.dark .row.user .msg .t { color: #c9dcf5; }
  body.dark .fwd .quote { background: rgba(255,255,255,.06); border-left-color: rgba(255,255,255,.2); }
  body.dark #selbar { background: #1f2a3a; border-top-color: #2c4a6e; color: #cfd2d9; }
  body.dark #selbar button { background: #26272e; border-color: #33353d; color: #cfd2d9; }
  body.dark #modal .box { background: #1e1f24; color: #e6e6e6; }
  body.dark #modal h3 { color: #f0f0f0; }
  body.dark #modal h4 { color: #b9bec7; }
  body.dark #modal input, body.dark #modal select, body.dark #modal textarea { background: #26272e; border-color: #33353d; color: #e6e6e6; }
  body.dark #modal label { color: #cfd2d9; }
  body.dark #modal .mrow { border-bottom-color: #2b2d34; }
  body.dark #modal .mrow button { background: #26272e; border-color: #33353d; }
  body.dark .confirmbar { background: #3a2224; border-color: #5c2b2e; }
  body.dark .hint, body.dark #hint { color: #8b8f99; }
  body.dark #netTag { background: #16341f; color: #7ee0a1; }
  body.dark #netTag.off { background: #3a1f22; color: #f1999f; }
  /* ==========================================================================
     视觉层 · 暖纸主题
     design tokens 照 AIROOM 的 styles.css 提炼（颜色/字号/圆角/阴影是客观数值）
     这一层是纯覆盖：不改任何布局逻辑。不想要就整块删掉，界面立刻回到原样。
     ========================================================================== */
  :root {
    --bg:#f6f0e7; --bg-deep:#efe6d9; --surface:#fffdf9; --surface-2:#faf5ee; --paper:#fffaf2;
    --ink:#2b231e; --ink-2:#5a4e45; --ink-3:#6e6156; --line:#e6dccf; --line-strong:#d6c8b6;
    --lamp:#e0a24e; --focus:#a9701f; --ink-4:#8b7f72; --lamp-soft:#fbecd2; --brand:#3a2c24; --brand-ink:#fff8ee;
    --ok:#3f8a5c; --warn:#9a7408; --bad:#c0463a;
    --shadow-sm:0 1px 2px rgb(60 40 20 / 6%), 0 1px 1px rgb(60 40 20 / 4%);
    --shadow:0 6px 18px -8px rgb(70 45 20 / 18%), 0 2px 6px -2px rgb(70 45 20 / 8%);
    --shadow-lg:0 24px 60px -24px rgb(60 35 15 / 35%), 0 8px 20px -10px rgb(60 35 15 / 18%);
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
    --font:"HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  html, body { font-family:var(--font) !important; color:var(--ink); -webkit-font-smoothing:antialiased; }
  body { background:var(--bg) !important; background-image:none !important; }

  #side { background:linear-gradient(180deg,var(--bg-deep),var(--bg)); border-right:1px solid var(--line); backdrop-filter:none; -webkit-backdrop-filter:none; color:var(--ink); }
  #sideHead b { color:var(--ink); font-size:16px; }
  .sec { color:var(--ink-3); font-size:12px; font-weight:600; letter-spacing:.04em; }
  .item { border-radius:var(--r-md); }
  .item:hover { background:var(--surface); }
  .item.active { background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); border:1px solid var(--line); }
  .item.active span, .item.active .more { color:var(--ink-3); }
  .item span { color:var(--ink-3); }
  #plusBtn, #setBtn { background:var(--surface); border-color:var(--line); color:var(--ink-2); }
  #sideFoot { border-top-color:var(--line); }

  #head, #statusbar, #modeTabs, #inputbar { background:var(--surface); backdrop-filter:none; -webkit-backdrop-filter:none; border-color:var(--line); }
  #head .title { color:var(--ink); font-size:16px; }
  #head .peers { color:var(--ink-3); }
  #chatPlus { background:var(--surface); border-color:var(--line); color:var(--ink-2); }
  #netTag { color:var(--ok); background:#e3f1e7; border-color:#cfe6d6; }
  #netTag.off { color:var(--bad); background:#f9e2de; border-color:#f0cfc9; }
  #sbMode { color:var(--ink); }
  .sb-calls, .sb-label { color:var(--ink-3); }
  .sb-actions button { background:var(--surface); border:1px solid var(--line); color:var(--ink-2); border-radius:var(--r-sm); }
  .sb-actions button:hover { background:var(--paper); border-color:var(--line-strong); }
  .sb-actions button.danger { border-color:#e8bdb6; color:var(--bad); }
  .sb-actions button.on { border-color:#e8c98d; color:#8a5a13; background:var(--lamp-soft); }
  .seat { background:var(--surface-2); border:1px solid transparent; border-radius:var(--r-md); }
  .seat.speaking { background:var(--surface); border-color:#e8c98d; box-shadow:0 0 0 3px rgb(224 162 78 / 12%), var(--shadow-sm); animation:seatPulse 1.8s var(--ease) infinite; }
  @keyframes seatPulse { 0%,100% { box-shadow:0 0 0 3px rgb(224 162 78 / 10%), var(--shadow-sm); } 50% { box-shadow:0 0 0 6px rgb(224 162 78 / 20%), var(--shadow-sm); } }
  .seat .st b { color:var(--ink); }
  .seat .st span { color:var(--ink-3); }
  .seat.speaking .st span { color:#8a5a13; }
  .pill { background:var(--surface); border:1px solid var(--line); color:var(--ink-3); }
  .pill.on { background:var(--lamp-soft); border-color:#e8c98d; color:#8a5a13; }
  #modeTabs button { color:var(--ink-3); }
  #modeTabs button:hover { background:var(--surface-2); }
  #modeTabs button.on { background:var(--paper); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow-sm); }

  #msgs { background:transparent; }
  .msg { background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); }
  .msg .who { color:var(--ink-3); opacity:1; }
  .row.user .msg { background:var(--lamp-soft); color:var(--ink); border-color:#e8cf9f; }
  .row.system .msg { background:transparent; border:0; box-shadow:none; color:var(--ink-3); }

  #in { background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:var(--r-md); }
  #in::placeholder { color:var(--ink-3); opacity:.75; }
  #in:focus { border-color:var(--lamp); background:#fff; }
  #send { background:var(--brand); color:var(--brand-ink); border-radius:var(--r-md); }
  #attachBtn { background:var(--surface); border-color:var(--line); color:var(--ink-2); }

  #modal { background:rgb(43 35 30 / 38%); }
  #modal .box { background:var(--surface); border-radius:var(--r-xl); box-shadow:var(--shadow-lg); color:var(--ink); }
  #modal h3 { color:var(--ink); font-size:16px; }
  #modal .grp h4 { color:var(--ink-3); }
  #modal label:hover { background:var(--surface-2); }
  #modal input, #modal textarea, #modal select { background:var(--surface-2) !important; border:1px solid var(--line) !important; border-radius:var(--r-sm) !important; color:var(--ink) !important; }
  #modal button { background:var(--surface); border:1px solid var(--line); color:var(--ink-2); border-radius:var(--r-sm); }
  #modal button.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
  #modal button.danger { color:var(--bad); border-color:#e8bdb6; }
  .pfBlock { border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 10px; background:var(--surface-2); }
  .badge { background:var(--bad); }

  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#e0d3c1; border:3px solid transparent; background-clip:content-box; border-radius:999px; }
  ::-webkit-scrollbar-thumb:hover { background:#cdbca6; background-clip:content-box; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* 首页空态（照他的欢迎屏：问候 → 大标题 → 说明 → 两个动作 → 成员卡） */
  .home-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; overflow:auto; }
  .home-empty .greet { font-size:12px; color:var(--ink-3); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 14px; margin-bottom:18px; }
  .home-empty h1 { font-size:32px; line-height:1.4; color:var(--ink); margin:0 0 10px; font-weight:700; }
  .home-empty p.sub { font-size:14px; color:var(--ink-3); margin:0 0 22px; max-width:520px; line-height:1.75; }
  .home-empty .acts { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:26px; }
  .home-empty .acts button { font-size:13px; padding:9px 18px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .home-empty .acts button:hover { background:var(--paper); border-color:var(--line-strong); }
  .home-empty .acts button.main { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
  .home-empty .members { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .home-empty .mcard { width:146px; padding:14px 12px 12px; border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .15s var(--ease), box-shadow .15s var(--ease); }
  .home-empty .mcard:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
  .home-empty .mcard .big { width:52px; height:52px; border-radius:999px; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:#3a2c24; }
  .home-empty .mcard b { display:block; font-size:13px; color:var(--ink); margin-bottom:2px; }
  .home-empty .mcard span { font-size:11px; color:var(--ink-3); }
/* 议题面板（P1） */
  .topic-panel { margin:16px auto; max-width:620px; padding:16px 18px; border-radius:var(--r-lg); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm); text-align:center; }
  .topic-panel .tp-head { font-size:14px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .topic-panel .tp-sub { font-size:12px; color:var(--ink-3); margin:0 0 12px; line-height:1.7; }
  .topic-panel .tp-slots { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:14px; }
  .tp-slot { font-size:11px; padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3); }
  .tp-slot.completed { background:#e3f1e7; border-color:#cfe6d6; color:var(--ok); }
  .tp-slot.running { background:var(--lamp-soft); border-color:#e8c98d; color:#8a5a13; }
  .tp-slot.skipped { color:var(--ink-4); }
  .topic-panel .tp-go { font-size:13px; padding:9px 22px; border-radius:var(--r-md); border:1px solid var(--brand); background:var(--brand); color:var(--brand-ink); cursor:pointer; }
  .topic-panel .tp-go:disabled { opacity:.6; cursor:default; }
  .topic-panel .tp-wait { font-size:12px; color:var(--ink-3); }
/* 主界面 */
  #homeView { flex:1; display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:40px 24px; }
  .home-wrap { width:100%; max-width:1060px; text-align:center; }
  .home-wrap .greet { display:inline-block; font-size:12px; color:var(--ink-3); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 14px; margin-bottom:18px; }
  .home-wrap h1 { font-size:32px; line-height:1.4; color:var(--ink); margin:0 0 10px; font-weight:700; }
  .home-wrap p.sub { font-size:14px; color:var(--ink-3); margin:0 auto 22px; max-width:520px; line-height:1.75; }
  .home-wrap .acts { display:flex; gap:10px; justify-content:center; margin-bottom:30px; }
  .home-wrap .acts button { font-size:13px; padding:9px 18px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .home-wrap .acts button:hover { background:var(--paper); border-color:var(--line-strong); }
  .home-wrap .acts button.main { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
  .home-wrap .hsec { font-size:12px; color:var(--ink-3); font-weight:600; letter-spacing:.04em; text-align:left; margin:0 0 10px; }
  .home-wrap .hcards { display:flex; gap:12px; flex-wrap:wrap; }
  .home-wrap .hcard { width:168px; text-align:left; padding:14px; border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .15s var(--ease), box-shadow .15s var(--ease); }
  .home-wrap .hcard:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
  .home-wrap .hcard .ico { width:34px; height:34px; border-radius:10px; background:var(--lamp-soft); display:flex; align-items:center; justify-content:center; font-size:17px; margin-bottom:9px; }
  .home-wrap .hcard b { display:block; font-size:13px; color:var(--ink); margin-bottom:3px; }
  .home-wrap .hcard span { font-size:11px; color:var(--ink-3); }
  .home-wrap .hfoot { margin-top:28px; font-size:11px; color:var(--ink-3); display:flex; gap:6px; align-items:center; justify-content:center; }
  .home-wrap .dot-ok { width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; }
/* 议题操作栏 + 并排对比（P2） */
  #main { position:relative; }
  #topicBar { display:none; gap:10px; align-items:center; justify-content:center; width:calc(100% - 48px); max-width:760px; margin:0 auto; padding:8px 12px 4px; background:transparent; font-size:12px; color:var(--ink-3); }
  #topicBar button { font-size:12px; padding:5px 12px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  #topicBar button:hover { background:var(--paper); border-color:var(--line-strong); }
  #topicBar .tb-sel b { color:var(--ink); }
  #compareView { position:absolute; inset:0; background:var(--bg); z-index:20; display:flex; flex-direction:column; }
  .cmp-head { display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--surface); }
  .cmp-head b { font-size:14px; color:var(--ink); }
  .cmp-sub { font-size:12px; color:var(--ink-3); }
  #cmpClose { margin-left:auto; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm); width:28px; height:28px; cursor:pointer; color:var(--ink-2); }
  .cmp-body { flex:1; display:flex; gap:14px; padding:16px; overflow:auto; }
  .cmp-col { flex:1; min-width:260px; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); padding:14px; }
  .cmp-col.picked { border-color:#e8c98d; box-shadow:0 0 0 3px rgb(224 162 78 / 14%), var(--shadow-sm); }
  .cmp-who { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .cmp-who b { font-size:13px; color:var(--ink); }
  .cmp-badge { margin-left:auto; font-size:11px; color:#8a5a13; background:var(--lamp-soft); border:1px solid #e8c98d; border-radius:999px; padding:2px 8px; }
  .cmp-text { flex:1; overflow:auto; font-size:13px; line-height:1.75; color:var(--ink-2); white-space:pre-wrap; }
  .cmp-pick { margin-top:12px; font-size:12px; padding:8px 0; border-radius:var(--r-sm); border:1px solid var(--brand); background:var(--brand); color:var(--brand-ink); cursor:pointer; }
  .cmp-pick:disabled { background:var(--surface-2); color:var(--ink-3); border-color:var(--line); cursor:default; }
#topicBar .primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
/* 人物卡 */
  .mc-wrap { display:flex; gap:18px; }
  .mc-left { width:230px; flex-shrink:0; }
  .mc-portrait { height:280px; border-radius:var(--r-lg); border:1px dashed var(--line-strong); background:var(--surface-2); display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer; overflow:hidden; color:var(--ink-3); font-size:12px; line-height:1.7; }
  .mc-portrait img { width:100%; height:100%; object-fit:cover; display:block; }
  .mc-ava-row { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .mc-ava { width:56px; height:56px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:#3a2c24; overflow:hidden; cursor:pointer; border:2px solid var(--surface); box-shadow:var(--shadow-sm); flex-shrink:0; }
  .mc-ava img { width:100%; height:100%; object-fit:cover; }
  .mc-ava-info b { display:block; font-size:13px; color:var(--ink); }
  .mc-ava-info span { font-size:11px; color:var(--ink-3); }
  .mc-right { flex:1; min-width:0; }
  .mc-lab { display:block; font-size:12px; color:var(--ink-3); margin:10px 0 5px; }
  .mc-in { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r-sm); font-size:13px; font-family:inherit; background:var(--surface-2); color:var(--ink); resize:vertical; }
  .mc-colors { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .mc-color { width:22px; height:22px; border-radius:999px; cursor:pointer; border:2px solid transparent; display:inline-block; }
  .mc-color.on { border-color:var(--ink); }
  .mc-auto { width:auto; padding:0 9px; height:22px; line-height:20px; font-size:11px; color:var(--ink-3); background:var(--surface-2); border:1px solid var(--line); border-radius:999px; }
  .mc-auto.on { border-color:var(--ink); color:var(--ink); }
  .mc-link { color:var(--focus); cursor:pointer; text-decoration:underline; font-size:11px; }
  .mc-two { display:flex; gap:12px; }
  .mc-two > div { flex:1; }
  .mc-del { color:var(--bad); border-color:#e8bdb6; }
.mc-portrait { position:relative; height:300px; border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface-2); overflow:hidden; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-3); font-size:12px; line-height:1.7; text-align:center; }
  .mc-portrait .mc-pimg { position:absolute; left:50%; top:50%; height:100%; width:auto; transform:translate(-50%,-50%); transform-origin:center; cursor:grab; user-select:none; -webkit-user-drag:none; }
  .mc-zoom { position:absolute; left:8px; bottom:8px; font-size:11px; color:#fff; background:rgba(43,35,30,.62); border-radius:999px; padding:2px 9px; pointer-events:none; }
  .mc-reset { position:absolute; right:8px; bottom:8px; font-size:11px; color:#fff; background:rgba(43,35,30,.62); border-radius:999px; padding:2px 9px; cursor:pointer; }
  .mc-reset:hover { background:rgba(43,35,30,.85); }
.mc-crop { width:100%; margin-top:10px; font-size:12px; padding:7px 0; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .mc-crop:hover { background:var(--paper); border-color:var(--line-strong); }
  .mc-crop:disabled { opacity:.6; cursor:default; }
/* 主界面房间卡（带立绘的人物卡） */
  .home-wrap .hrooms { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .home-wrap p.sub { max-width:640px; }
  .hrcard { width:190px; border-radius:var(--r-lg); overflow:hidden; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease); }
  .hrcard:hover { transform:translateY(-4px); box-shadow:var(--shadow); }
  .hr-media { position:relative; height:240px; overflow:hidden; background:var(--surface-2); }

  .hr-info { padding:10px 12px 12px; text-align:left; background:var(--surface); }
  .hr-avas { display:flex; gap:4px; margin-bottom:6px; }
  .hr-avas .ava { width:20px; height:20px; font-size:10px; border:1px solid var(--surface); }
  .hr-info b { display:block; font-size:13px; color:var(--ink); margin-bottom:2px; }
  .hr-info span { display:block; font-size:11px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hr-media.empty { display:flex; align-items:center; justify-content:center; }

  .home-wrap .hroomrows { display:flex; flex-direction:column; gap:8px; max-width:460px; }
  .hrow { display:flex; align-items:center; gap:9px; padding:10px 14px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface); cursor:pointer; text-align:left; }
  .hrow:hover { background:var(--paper); border-color:var(--line-strong); }
  .hrow .hd { font-size:14px; }
  .hrow b { font-size:13px; color:var(--ink); }
  .hrow .hs { margin-left:auto; font-size:11px; color:var(--ink-3); }
/* 空群：叠排头像 + 群名 + 两个动作（照 AIROOM 的空态） */
  .home-empty.empty-room { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:40px 20px; }
  .home-empty .eavas { display:flex; }
  .home-empty .eavas .ava { width:56px; height:56px; font-size:20px; border:3px solid var(--surface); margin-left:-14px; box-shadow:var(--shadow-sm); }
  .home-empty .eavas .ava:first-child { margin-left:0; }
  .home-empty.empty-room h1 { font-size:22px; margin:0; color:var(--ink); }
  .home-empty.empty-room .acts { display:flex; gap:10px; margin-top:4px; }
  .home-empty.empty-room .acts button { font-size:13px; padding:9px 18px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .home-empty.empty-room .acts button.main { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
/* 输入框：照 AIROOM 的"大圆角框 + 框内底栏 + 圆形发送" */
  #inputbar { width:calc(100% - 48px); max-width:760px; margin:10px auto 16px; padding:8px 12px 8px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:2px; position:relative; box-sizing:border-box; }
  #inputbar #in { border:none; background:transparent; padding:9px 4px 4px; font-size:14px; width:100%; outline:none; font-family:inherit; color:var(--ink); }
  #inputbar #in::placeholder { color:var(--ink-4); }
  #ibBottom { display:flex; align-items:center; gap:8px; padding:2px 0 2px; }
  #ibBottom #attachBtn { width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--ink-3); font-size:16px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }

<body>

<script>
const COLORS = ['#fde68a','#fbcfe8','#a7f3d0','#ddd6fe','#bae6fd','#fed7aa'];
const $ = (id) => document.getElementById(id);
const msgs = $('msgs'), inp = $('in');
let M = [], rooms = {}, states = {}, netOnline = true, active = 'free', colorMap = {}, streaming = {}, mdom = {}, maxR = 6;
let unread = {};   // 未读条数：{ 'dm:kimi': 2, free: 3 } —— 对应微信的红点/角标
let roomSettings = {}, histDefault = 6000;   // 每个会话独立设置（上下文长度）
let topics = {};
let appAddressing = 'MD';   // 模型怎么称呼你（全局）                              // 议题：id -> topic（来自 /api/state.topics 与 SSE topic 事件）
const TOPIC_STATUS = { preparing:'准备材料', reviewing:'各自准备中', discussing:'讨论中', summarizing:'整理结论中', conclusion:'待确认结论', confirmed:'结论已确认', ended:'已结束', blocked:'需要核对' };
const KIND_LABEL = { review:'评审', candidates:'比稿', proposals:'方案比较' };
const SLOT_LABEL = { queued:'准备中', running:'正在准备…', completed:'已交稿', skipped:'已跳过', blocked:'出错' };
const topicByRoom = (rid) => Object.values(topics).find(t => t.roomId === rid) || null;
let loading = false, pendingRows = [], loadSeq = 0;   // 切房间时的加载窗口：先缓存实时消息，加载完再补画

const colorOf = (n) => colorMap[n] ??= COLORS[Object.keys(colorMap).length % COLORS.length];
const hhmm = (ts) => new Date(ts || Date.now()).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// 群头像：把前 4 位成员的头像拼成一张（微信那种四宫格），比一个"群"字好看
function roomAva(r){
  const mem = (r.members || []).map(memberById).filter(Boolean).slice(0, 4);
  if (!mem.length) return `<div class="ava gava"><i style="background:var(--line-strong)">群</i></div>`;
  const cell = (m) => m.avatar
    ? `<i style="background-image:url('${esc(m.avatar)}')"></i>`
    : `<i style="background:${m.color || colorOf(m.name)}">${esc(String(m.emoji || m.name || '?')[0])}</i>`;
  return `<div class="ava gava${mem.length === 1 ? ' one' : ''}">${mem.map(cell).join('')}</div>`;
}
// 消息里的头像：能按名字找到成员就用他那张头像，否则退回首字母
const ava = (name) => {
  const mb = M.find(x => x.name === name);
  if (mb) return avaM(mb);
  return `<div class="ava" style="background:${colorOf(name)}">${esc(String(name || '?')[0])}</div>`;
};
// 成员头像：配了 emoji 就用 emoji，否则用名字首字
const colorForName = (n) => { const mm = M.find(x => x.name === n); return (mm && mm.color) || colorOf(n); };
// 气泡底色可能很深（比如 #6e6156），文字要跟着换，不然看不清
const textOn = (hex) => {
  const h = String(hex || '').replace('#', '');
  if (h.length < 6) return '#2b231e';
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.62 ? '#2b231e' : '#fffdfa';
};
const avaM = (m) => (m && m.avatar)
  ? `<div class="ava" style="background:${m.color || colorOf(m.name)};background-image:url('${esc(m.avatar)}');background-size:cover;background-position:center"></div>`
  : `<div class="ava" style="background:${(m && m.color) || colorOf(m && m.name || '')}">${esc((m && (m.emoji || m.name[0])) || '?')}</div>`;
function attachHtml(a){
  if (!a) return '';
  const mime = a.mime || '';
  if (a.kind === 'image' || mime.startsWith('image/')) return `<div style="margin-top:6px"><img src="${esc(a.url)}" style="max-width:260px;max-height:260px;border-radius:8px;display:block"></div>`;
  if (a.kind === 'video' || mime.startsWith('video/')) return `<div style="margin-top:6px"><video src="${esc(a.url)}" controls style="max-width:320px;max-height:240px;border-radius:8px;display:block"></video></div>`;
  return `<div style="margin-top:6px"><a href="${esc(a.url)}" download="${esc(a.name)}" target="_blank" style="color:var(--focus);text-decoration:underline">📎 ${esc(a.name)}</a></div>`;
}
const memberById = (id) => M.find(m => m.id === id);
const isOff = (m) => { const st = states[m.id] || {}; return !!st.down || (!netOnline && m.provider !== 'qwen3-8b'); };

function roomMembers(roomId){
  if (roomId.startsWith('dm:')) { const m = memberById(roomId.slice(3)); return m ? [m] : []; }
  return (rooms[roomId]?.members || []).map(memberById).filter(Boolean);
}
function roomName(roomId){
  if (roomId.startsWith('dm:')) return memberById(roomId.slice(3))?.name ?? '私聊';
  return rooms[roomId]?.name ?? roomId;
}

// ---------- 侧栏 ----------
function renderSide(){
  $('groups').innerHTML = '';
  const gids = ['work', 'free', ...Object.keys(rooms).filter(k => k !== 'work' && k !== 'free')]
    .filter(k => rooms[k])
    .sort((a, b) => (rooms[b].pinned ? 1 : 0) - (rooms[a].pinned ? 1 : 0));   // 置顶的排前面
  for (const gid of gids) {
    const r = rooms[gid];
    const d = document.createElement('div');
    d.className = 'item' + (active === gid ? ' active' : '');
    d.innerHTML = `${roomAva(r)}<div class="t"><b>${r.pinned ? '📌' : ''}${esc(r.name)}</b><span>${r.members.length} 位成员</span></div><button class="more" title="更多">⋯</button>`;
    if (unread[gid]) d.insertAdjacentHTML('beforeend', `<span class="badge">${unread[gid] > 99 ? '99+' : unread[gid]}</span>`);
    d.onclick = () => openRoom(gid);
    d.querySelector('.more').onclick = (e) => { e.stopPropagation(); openRoomMenu(e, gid); };
    $('groups').appendChild(d);
  }
  $('contacts').innerHTML = '';
  mdom = {};
  for (const m of M) {
    const d = document.createElement('div');
    d.className = 'item' + (active === 'dm:' + m.id ? ' active' : '') + (isOff(m) ? ' off' : '');
    const subline = m.tagline ? m.tagline : (esc(m.model) + (m.persona ? ' · 🎭' + esc(m.persona) : ''));
    d.innerHTML = `${avaM(m)}<div class="t"><b>${esc(m.name)}</b><span>${m.tagline ? esc(m.tagline) : subline}</span></div>`;
    const dot = document.createElement('i');
    const st = states[m.id] || {};
    dot.className = 'dot' + (isOff(m) ? ' off' : st.speaking ? ' typing' : '');
    d.querySelector('.ava').appendChild(dot);
    mdom[m.id] = dot;
    const n = unread['dm:' + m.id];
    if (n) {
      d.querySelector('.ava').insertAdjacentHTML('beforeend', '<i class="unread"></i>');
      d.insertAdjacentHTML('beforeend', `<span class="badge">${n > 99 ? '99+' : n}</span>`);
    }
    d.onclick = (e) => { e.stopPropagation(); openMemberPop(m, d); };
    $('contacts').appendChild(d);
  }
}
function paint(m){ const dot = mdom[m.id]; if (!dot) return; const st = states[m.id] || {}; dot.className = 'dot' + (isOff(m) ? ' off' : st.speaking ? ' typing' : ''); }

// ---------- 消息 ----------
function msgRow(rec){
  if (rec.id && document.getElementById(rec.id)) return null;   // 幂等：同一条不画两次
  const he = document.getElementById('homeEmpty');
  if (he) he.remove();                                          // 有消息了，欢迎屏撤掉
  const row = document.createElement('div');
  row.className = 'row ' + (rec.kind === 'user' ? 'user' : rec.kind === 'system' ? 'system' : '');
  row.id = rec.id;
  if (rec.kind === 'member') row.innerHTML = `${ava(rec.from)}<div class="msg" style="background:${colorForName(rec.from)};color:${textOn(colorForName(rec.from))}"><div class="who">${esc(rec.from)} · ${hhmm(rec.ts)}</div><div class="body">${esc(rec.text)}</div></div>`;
  else if (rec.kind === 'user') row.innerHTML = `<div class="msg">${rec.text ? `<div class="body">${esc(rec.text)}</div>` : ''}${attachHtml(rec.attach)}<div class="t">${hhmm(rec.ts)}</div></div>`;
  else if (rec.kind === 'forward') {
    const items = (rec.forward?.items || []).map(it => {
      const t = new Date(it.ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      return `<div class="quote"><div class="qhead">转发自 ${esc(it.chain.map(roomName).join(' → '))} · ${esc(it.from)} · ${t}</div><div>${esc(it.text)}</div></div>`;
    }).join('');
    row.innerHTML = `<div class="msg fwd" style="background:#eef2ff"><div class="who">你 · 转发 · ${hhmm(rec.ts)}</div>${rec.text ? `<div class="comment">${esc(rec.text)}</div>` : ''}${items}</div>`;
  }
  else row.innerHTML = `<div class="msg">${esc(rec.text)}</div>`;
  if (selectMode && rec.kind !== 'system') {
    row.insertAdjacentHTML('afterbegin', '<div class="pick"></div>');
    if (selected.has(rec.id)) row.classList.add('sel');
  }
  msgs.appendChild(row); msgs.scrollTop = msgs.scrollHeight;
  return row;
}
async function openRoom(id){
  // 无条件退出主界面：标志和 DOM 可能不同步，进房间一定得把聊天区放出来
  homeMode = false;
  const _hv = $('homeView'); if (_hv) _hv.style.display = 'none';
  ['head','statusbar','msgs','inputbar'].forEach(k => { const e = $(k); if (e) e.style.display = ''; });
  active = id;
  delete unread[id];                                  // 打开即清红点
  if (typeof closeMention === 'function') closeMention();
  const list = roomMembers(id);
  $('title').textContent = roomName(id);
  $('peers').textContent = id.startsWith('dm:') ? (list[0]?.model ?? '') : list.map(m => m.name).join('、');
   // 群成员项只在群里出现
  renderSide();
  const token = ++loadSeq;
  loading = true; pendingRows = [];
  const r = await fetch('/api/messages?room=' + encodeURIComponent(id)).then(x => x.json());
  if (token !== loadSeq) return;                      // 期间又切了房间，放弃这次渲染
  msgs.innerHTML = '';

  loading = false;

// 议题房间：未揭晓时在聊天区底部挂一块"各自准备中"的面板 + 揭晓按钮
function renderTopicPanel(){
  const old = document.getElementById('topicPanel');
  if (old) old.remove();
  const tp = topicByRoom(active);
  if (!tp) return;
  if (tp.revealedAt) return;
  const done = tp.slots.filter(s => s.status === 'completed' || s.status === 'skipped').length;
  const ready = done === tp.slots.length && tp.status === 'reviewing';
  const d = document.createElement('div');
  d.id = 'topicPanel';
  d.className = 'topic-panel';
  d.innerHTML = `<div class="tp-head">🧭 ${KIND_LABEL[tp.kind] || '议题'} · ${TOPIC_STATUS[tp.status] || tp.status}</div>
    <p class="tp-sub">${ready ? '全部成员都交稿了，可以揭晓。' : '各成员在各自独立作答，公开前互相看不到对方的产出。'}</p>
    <div class="tp-slots">${tp.slots.map(s => {
      const mb = memberById(s.memberId);
      return `<span class="tp-slot ${s.status}">${esc(mb?.name || s.memberId)} · ${SLOT_LABEL[s.status] || s.status}</span>`;
    }).join('')}</div>
    ${ready ? `<button class="tp-go" id="tpReveal">揭晓 ${done} 份</button>` : `<div class="tp-wait">准备中 ${done}/${tp.slots.length}</div>`}`;
  msgs.appendChild(d);
  const btn = $('tpReveal');
  if (btn) btn.onclick = async () => {
    btn.disabled = true; btn.textContent = '揭晓中…';
    const r = await apiPost('/api/topic/reveal', { topicId: tp.id });
    if (!r.ok) { alert('揭晓失败：' + (r.error || '未知')); btn.disabled = false; btn.textContent = '揭晓'; return; }
    topics[r.topic.id] = r.topic;
    await openRoom(active);
  };
}

const MODE_LABEL = { free: '圆桌讨论中', isolated: '各自作答中', flow: '自由讨论中', persona: '按设定发言中' };
let roundInfo = {};                       // roomId -> { calls, paused }，由服务端 round 事件同步
const apiPost = (path, body) => fetch(path, {

function renderStatusBar(){
  const bar = $('statusbar');
  if (!bar) return;
  const _home = $('homeView');
  if (homeMode || (_home && _home.style.display && _home.style.display !== 'none')) { bar.style.display = 'none'; return; }   // 主界面可见时不显示状态条
  const isDm = active.startsWith('dm:');

  $('modeTabs').style.display = isDm ? 'none' : '';   // 议题房间也能切模式：揭晓后想让大家独立评价，就切独立
  if (isDm) return;
  const st = roomSettings[active] || {};
  const mode = st.mode === 'persona' ? 'free' : (st.mode || 'free');   // 旧数据兼容：设定模式已取消
  const ri = roundInfo[active] || { calls: 0, paused: false };
  const activeRun = !!ri.who || !!ri.paused;               // 暂停中这一轮还挂着，也算"进行中"
  const tp = topicByRoom(active);
  let label;
  if (tp) {
    const done = tp.slots.filter(s => s.status === 'completed' || s.status === 'skipped').length;
    label = `${KIND_LABEL[tp.kind] || '议题'} · ${TOPIC_STATUS[tp.status] || tp.status} · ${done}/${tp.slots.length} 已交稿`;
  } else {
    label = MODE_LABEL[mode] || '讨论中';
    if (ri.who) label += ' · ' + ri.who + ' 正在发言';
    if (ri.beat && ri.total) label += ' · 第 ' + ri.beat + '/' + ri.total + ' 拍';
    if (activeRun && ri.paused) label += ' · 已暂停';
  }
  $('sbMode').textContent = label;
  $('sbCalls').textContent = '已调用 ' + (ri.calls || 0) + ' 次';
  $('sbCalls').title = '本轮调用次数（含失败与中断）；次数不等于费用';
  const pb = $('sbPause');
  pb.textContent = ri.paused ? '▶ 继续接话' : '⏸ 暂停接话';
  pb.classList.toggle('on', !!(activeRun && ri.paused));
  pb.disabled = !activeRun;
  pb.style.opacity = activeRun ? '' : '.45';
  const sbStopBtn = $('sbStop');
  sbStopBtn.disabled = !activeRun;
  sbStopBtn.style.opacity = activeRun ? '' : '.45';
  const list = roomMembers(active);
  const pres = st.present || {};
  $('sbSeats').innerHTML = list.map(m => {
    const s = states[m.id] || {};
    const out = pres[m.id] === false;
    const speaking = !!s.speaking && !out;
    const off = isOff(m) || out;
    let label = out ? '已离席' : speaking ? '正在说话…' : isOff(m) ? '不在线' : '在场';
    let hot = speaking, done = false;
    if (tp) {                                              // 议题房间：席位显示"交稿状态"
      const slot = tp.slots.find(x => x.memberId === m.id);
      label = slot ? (SLOT_LABEL[slot.status] || slot.status) : '不在本议题';
      hot = !!slot && slot.status === 'running';            // 只有"正在准备"才呼吸
      done = !!slot && slot.status === 'completed';         // 已交稿：静态描边，不动
    }
    return `<div class="seat${hot ? ' speaking' : ''}${done ? ' done' : ''}${off ? ' off' : ''}" data-id="${m.id}">${avaM(m)}` +
      `<div class="st"><b>${esc(m.name)}${hot && !tp ? ' · 正在发言' : ''}${done ? ' ✓' : ''}</b><span>${label}</span></div></div>`;
  }).join('');
  $('sbPills').innerHTML = tp ? '' : list.map(m => {
    const on = pres[m.id] !== false;
    return `<button class="pill${on ? ' on' : ''}" data-pid="${m.id}">${esc(m.name)} ${on ? '✓' : '○'}</button>`;
  }).join('') + `<button class="pill-add" id="sbAddMember" title="把成员加进这个群">＋</button>` +
                `<button class="pill-add pill-del" id="sbDelMember" title="把成员移出这个群">－</button>`;
  const _add = $('sbAddMember');
  if (_add) _add.onclick = (e) => { e.stopPropagation(); openAddToRoom(); };
  const _del = $('sbDelMember');

  document.querySelectorAll('#modeTabs button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  renderTopicBar(tp);
}

// 议题操作栏：并排对比 / 已采用提示（P2）
function renderTopicBar(tp){
  const bar = $('topicBar'); if (!bar) return;
  if (homeMode || !tp || !tp.revealedAt) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  const sel = tp.slots.find(s => s.memberId === tp.selectedSlotId);
  const selText = sel ? `<span class="tb-sel">已采用：<b>${esc((memberById(sel.memberId) || {}).name || sel.memberId)}</b></span>` : `<span class="tb-hint">还没选稿</span>`;
  bar.style.display = 'flex';
  if (tp.status === 'summarizing') {
    bar.innerHTML = `<span class="tb-hint">正在整理纪要，稍等…</span>`;
  } else if (tp.status === 'conclusion') {
    bar.innerHTML = `<button id="tbConfirm" class="primary">✓ 确认结论</button><button id="tbReopen">↺ 再议一轮</button><button id="tbEnd">⏹ 结束议题</button><button id="tbExport">⧉ 复制给 agent</button>${selText}`;
    $('tbConfirm').onclick = () => topicAct(tp, 'confirm');
    $('tbExport').onclick = () => openTopicExport(tp);
    $('tbReopen').onclick = () => topicAct(tp, 'reopen');
    $('tbEnd').onclick = () => topicAct(tp, 'end');
  } else if (tp.status === 'confirmed' || tp.status === 'ended') {
    bar.innerHTML = `<span class="tb-sel"><b>${TOPIC_STATUS[tp.status]}</b></span><button id="tbExport">⧉ 复制给 agent</button>${selText}`;
    $('tbExport').onclick = () => openTopicExport(tp);

// 导出成 markdown：标题 + 材料 + 采用的版本 + 纪要（可直接粘给 Claude Code / DSH）
function topicMarkdown(tp) {
  const name = (id) => (memberById(id) || {}).name || id;
  const sel = tp.slots.find(s => s.memberId === tp.selectedSlotId);
  const d = new Date(tp.updatedAt || Date.now());
  const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const out = [];
  out.push(`# 圆桌议题：${tp.title}`);
  out.push(`类型：${KIND_LABEL[tp.kind] || tp.kind} ｜ 状态：${TOPIC_STATUS[tp.status] || tp.status} ｜ ${stamp}`);
  if (tp.material?.text) out.push(`\n## 议题材料\n${tp.material.text}`);
  if (sel) out.push(`\n## 采用的版本（${name(sel.memberId)}）\n${sel.text || ''}`);
  else out.push(`\n## 采用的版本\n（未选稿）`);
  if (tp.conclusion?.text) out.push(`\n## 结论（纪要）\n${tp.conclusion.text}`);
  out.push(`\n---\n由「圆桌」生成 · 这份内容可以直接粘给 Claude Code / DSH 当作任务材料。`);
  return out.join('\n');
}
function openTopicExport(tp) {

let selectMode = false, selected = new Set(), selPurpose = 'forward';
function setSelectMode(on){

function updateSelbar(){

  $('doFwd').textContent = isDel ? '删除所选' : '转发…';

function refreshPickUI(){
  for (const row of msgs.querySelectorAll('.row')) {
    if (row.classList.contains('system')) continue;

    if (selectMode && !has) row.insertAdjacentHTML('afterbegin', '<div class="pick"></div>');
    if (!selectMode && has) has.remove();
    row.classList.toggle('sel', selectMode && selected.has(row.id));
  }
  $('selcount').textContent = String(selected.size);
}

  const r = anchor.getBoundingClientRect();
  const W = 268, H = el.getBoundingClientRect().height || 380;
  let left = r.right + 10;
  if (left + W > window.innerWidth - 12) left = Math.max(12, r.left - W - 10);
  let top = r.top;
  if (top + H > window.innerHeight - 12) top = Math.max(12, window.innerHeight - H - 12);
  el.style.left = Math.round(left) + 'px';
  el.style.top = Math.round(top) + 'px';
  $('mpClose').onclick = (e) => { e.stopPropagation(); closeMemberPop(); };

// ---------- 人物卡（照 AIROOM 的人物卡布局：立绘 + 头像 + 简介 + 代表色 + 人设） ----------
async function fileToB64(f){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => { const s = String(fr.result || ''); res(s.slice(s.indexOf(',') + 1)); }; fr.onerror = rej; fr.readAsDataURL(f); });
}
async function pickImageFile(){
  return new Promise((resolve) => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg,image/webp,image/gif';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return resolve(null);
      try { const data = await fileToB64(f); const r = await apiPost('/api/upload', { name: f.name, mime: f.type, data }); resolve(r.ok ? r.url : null); }
      catch (e) { resolve(null); }
    };
    inp.click();
  });
}

  const box = $('modalBox');
  box.innerHTML = `<h3>搜索</h3>
    <input id="searchQ" placeholder="输入关键词，跨所有会话搜索…" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:10px;font-family:inherit">
    <div id="searchHits" style="max-height:46vh;overflow-y:auto;font-size:13px;color:var(--ink-3)">输入关键词开始搜索</div>`;
  $('modal').style.display = 'flex';
  const q = $('searchQ');
  q.focus();
  let timer = null;
  q.oninput = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const kw = q.value.trim();
      const hitsEl = $('searchHits');
      if (!kw) { hitsEl.textContent = '输入关键词开始搜索'; return; }
      const r = await fetch('/api/search?q=' + encodeURIComponent(kw)).then(x => x.json());
      if (!r.hits.length) { hitsEl.textContent = '没有找到匹配内容'; return; }
      hitsEl.innerHTML = r.hits.map(h => {
        const t = new Date(h.ts).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        return `<div class="hit" data-room="${esc(h.room)}" style="padding:8px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:var(--surface-2)">
          <div style="font-size:11px;color:var(--ink-4)">${esc(h.roomName)} · ${esc(h.from)} · ${t}</div>
          <div style="color:var(--ink)">${esc(h.text.slice(0, 120))}</div></div>`;
      }).join('');
      hitsEl.querySelectorAll('.hit').forEach(el => el.onclick = () => { $('modal').style.display = 'none'; openRoom(el.dataset.room); });
    }, 300);
  };
}

// ---------- 群名 ⋯ 菜单：置顶 / 重命名 / 删除对话 ----------
function openRoomMenu(e, roomId){
  const r = rooms[roomId];
  if (!r) return;
  const m = $('roomMenu');
  m.innerHTML = `<div data-r="pin">${r.pinned ? '📌 取消置顶' : '📌 置顶'}</div>
    <div data-r="rename">✏️ 重命名</div>
    <div data-r="del">🗑 删除</div>`;
  m.style.display = 'block';
  m.style.left = Math.min(e.clientX, innerWidth - 150) + 'px';
  m.style.top = Math.min(e.clientY, innerHeight - 130) + 'px';
  m.onclick = async (ev) => {
    const act = ev.target.dataset.r;
    if (!act) return;
    m.style.display = 'none';
    if (act === 'pin') {
      await fetch('/api/rooms/pin', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room: roomId, pinned: !r.pinned }) }).then(x => x.json());
    } else if (act === 'rename') {
      openRename(roomId);
    } else if (act === 'del') {
      openDelete(roomId);
    }
  };
}
function openRename(roomId){
  const r = rooms[roomId]; if (!r) return;
  const box = $('modalBox');
  box.innerHTML = `<h3>重命名群聊</h3>
    <input id="rnName" value="${esc(r.name)}" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin:10px 0;font-family:inherit">
    <div class="foot"><button id="rnCancel">取消</button> <button class="primary" id="rnGo">保存</button></div>`;
  $('modal').style.display = 'flex';
  $('rnName').focus(); $('rnName').select();
  $('rnCancel').onclick = () => { $('modal').style.display = 'none'; };
  $('rnGo').onclick = async () => {
    const name = $('rnName').value.trim();
    if (!name) { alert('名称不能为空'); return; }
    const res = await fetch('/api/rooms/rename', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room: roomId, name }) }).then(x => x.json());
    $('modal').style.display = 'none';
    if (!res.ok) alert('重命名失败：' + (res.error || '未知'));
    else { rooms[roomId].name = name; renderSide(); if (active === roomId) $('title').textContent = name; }
  };
}

// ---------- 删除（群 / 对话，都要二次确认） ----------
function openDelete(roomId = active){
  const isCustom = !['work', 'free'].includes(roomId) && !roomId.startsWith('dm:');
  const name = roomName(roomId);
  const box = $('modalBox');

  const askConfirm = (title, desc, danger, onOk) => {
    box.innerHTML = `<h3>${title}</h3>
      <p style="font-size:14px;line-height:1.7;margin:10px 0">${desc}<br><span style="color:#dc2626">此操作不可恢复。</span></p>
      <div class="foot"><button id="delCancel">取消</button> <button class="primary" id="delGo" style="background:#dc2626;border-color:#dc2626">确认</button></div>`;
    $('modal').style.display = 'flex';
    $('delCancel').onclick = () => { openDelete(roomId); };
    $('delGo').onclick = onOk;
  };

  box.innerHTML = `<h3>删除</h3>
    <p style="font-size:13px;color:var(--ink-3);margin:10px 0 14px">对「<b>${esc(name)}</b>」执行哪种操作？</p>
    ${isCustom ? `<button class="primary" id="optRoom" style="width:100%;padding:12px;margin-bottom:8px;background:#dc2626;border-color:#dc2626">🗑 删除该群（群和全部聊天记录一起删除）</button>` : ''}
    <button class="primary" id="optClear" style="width:100%;padding:12px;margin-bottom:8px">🧹 清空对话（保留${roomId.startsWith('dm:') ? '聊天' : '群'}，只删记录）</button>
    <div style="font-size:11px;color:var(--ink-4);margin-top:6px">${isCustom ? '' : '「工作模式 / 自由模式」是内置群，只能清空记录，不能删除群本身。'}</div>`;
  $('modal').style.display = 'flex';

  if (isCustom) $('optRoom').onclick = () => askConfirm('确认删除该群',
    `群聊「${esc(name)}」及其全部聊天记录将被永久删除。`, true,
    async () => {
      const r = await fetch('/api/rooms/clear', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room: roomId, deleteRoom: true }) }).then(x => x.json());
      $('modal').style.display = 'none';
      if (!r.ok) return alert('删除失败：' + (r.error || '未知'));
      delete rooms[roomId]; renderSide();
      if (active === roomId) openRoom('free');
    });

  $('optClear').onclick = () => askConfirm('确认清空对话',
    `「${esc(name)}」的全部聊天记录将被删除，${roomId.startsWith('dm:') ? '聊天本身' : '群聊本身'}保留。`, true,
    async () => {
      const r = await fetch('/api/rooms/clear', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room: roomId, deleteRoom: false }) }).then(x => x.json());
      $('modal').style.display = 'none';
      if (!r.ok) return alert('清空失败：' + (r.error || '未知'));
      if (active === roomId) msgs.innerHTML = '';
    });
}

// ---------- 删除模型（＋ → 删除模型，二次确认） ----------
function openRemoveMember(){
  const box = $('modalBox');
  box.innerHTML = `<h3>删除模型</h3>
    <div style="font-size:12px;color:var(--ink-3);margin:10px 0 4px">点 ✕ 把该模型整体移出圆桌（会从所有群聊中移除，历史记录保留）</div>
    ${M.map(m => `<div class="mrow"><span>${esc(m.name)}</span><span class="mm">${esc(m.provider)} / ${esc(m.model)}</span><button class="x" data-id="${m.id}">✕</button></div>`).join('')}
    <div id="confirmBar"></div>`;
  $('modal').style.display = 'flex';
  box.querySelectorAll('button.x').forEach(b => b.onclick = () => {
    const m = memberById(b.dataset.id);
    const bar = $('confirmBar');
    bar.className = 'confirmbar';
    bar.innerHTML = `确定删除模型「${esc(m.name)}」吗？<br><span style="color:#dc2626">它会从所有群聊中被移除（聊天记录保留）。</span><br>
      <button id="yes" class="danger">确认删除</button> <button id="no">取消</button>`;
    $('no').onclick = () => { bar.className = ''; bar.innerHTML = ''; };
    $('yes').onclick = async () => {
      const r = await fetch('/api/members/remove', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: m.id }) }).then(x => x.json());
      if (!r.ok) { alert('删除失败：' + (r.error || '未知')); return; }
      M = M.filter(x => x.id !== m.id);
      if (active === 'dm:' + m.id) { $('modal').style.display = 'none'; openRoom('free'); return; }
      openRemoveMember();
    };
  });
}

// ---------- 聊天窗口设置（每个会话独立） ----------
function openRoomSettings(){
  const st = roomSettings[active] || {};
  const cur = st.histChars ?? histDefault;
  const curMode = st.mode || 'free';
  const isGroup = !active.startsWith('dm:');
  let order = isGroup ? [...(rooms[active]?.members || [])] : [];
  const box = $('modalBox');
  box.innerHTML = `<h3>设置 · ${esc(roomName(active))}</h3>
    <div style="font-size:12px;color:var(--ink-3);margin:12px 0 4px">对话上下文长度（字符）。数值越大，模型记得越多，也越费 token。</div>
    <input id="rsHist" type="number" min="500" max="400000" step="500" value="${cur}" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px">
    <div style="font-size:11px;color:var(--ink-4);margin-top:6px">默认 ${histDefault}（约 4000 tokens，约 20 条消息）· 仅对本会话生效</div>

    <div style="font-size:12px;color:var(--ink-3);margin:16px 0 6px">互搏最大轮数（「让A和B讨论」时最多来回几轮）：</div>
    <input id="rsRounds" type="number" min="1" max="50" step="1" value="${st.maxRounds ?? maxR}" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px">
    <div style="font-size:11px;color:var(--ink-4);margin-top:6px">默认 ${maxR} 轮 · 仅对本会话生效</div>

    <div style="font-size:12px;color:var(--ink-3);margin:16px 0 6px">会话模式：</div>
    <select id="rsMode" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:13px">
      <option value="free">圆桌模式 —— 各成员轮流发言，后一位能看到前一位说的（默认）</option>
      <option value="isolated">独立模式 —— 各成员同时独立作答，互相看不到对方答案（避免附和）</option>
      <option value="flow">自由模式 —— 一拍一人，谁开口按发言倾向随机（像群聊）</option>
    </select>
    <div style="font-size:11px;color:var(--ink-4);margin-top:6px">成员的人设不在这里设 —— 在左侧联系人那一行点 ⋯ → 个人资料，全局生效。</div>
    <div id="modeHint" style="font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.6"></div>
    <div id="personaArea" style="margin-top:10px"></div>
    <div id="flowArea" style="margin-top:10px"></div>

    ${isGroup ? `<div id="orderWrap"><div style="font-size:12px;color:var(--ink-3);margin:16px 0 6px">发言顺序（群里轮流回答的先后）：</div>
      <div id="orderList" style="border:1px solid var(--line);border-radius:8px;padding:4px 8px"></div></div>`
      : `<div style="font-size:12px;color:var(--ink-4);margin:16px 0 6px">私聊只有一个成员，无需设置发言顺序。</div>`}
    <div class="foot"><button id="rsReset">恢复默认</button> <button class="primary" id="rsGo">保存</button></div>`;
  $('modal').style.display = 'flex';
  $('rsReset').onclick = () => { $('rsHist').value = histDefault; };
  $('rsMode').value = curMode;

  const MODE_HINT = {
    free: '圆桌模式：成员按设定顺序逐个发言，后一位能看到前一位说的话——像围坐一桌依次发言，流畅，但容易附和。',
    isolated: '独立模式：收到消息后全员同时发起作答，每个人只看得到你的提问，看不到本轮其他人的答案。用来交叉验证「模型各自真实判断」时开这个。注：本机 8b 单卡排队，所以是同时发起、先后返回。',
    flow: '自由模式：不排班。一条消息进来后每一拍只让一个人说——谁开口由「发言倾向」加权随机决定，被点名的优先，都没命中就随机兜底。说完把话头交出去，最多续「自动续拍」那么多拍，你随时可以发消息或喊「停」打断。',
    persona: '设定模式：给每个成员写死身份，各司其职。',
  };
  const renderPersona = () => {
    const mode = $('rsMode').value;
    $('modeHint').textContent = MODE_HINT[mode] || '';
    const list = roomMembers(active);
    // 发言顺序只在圆桌/设定模式下生效：独立模式全员并发、自由模式随机选人，顺序没意义，直接隐藏别让人以为能调
    const ow = $('orderWrap');
    if (ow) ow.style.display = (mode === 'free' || mode === 'persona') ? '' : 'none';

    const area = $('personaArea');
    if (!list.length) area.innerHTML = '';
    else area.innerHTML = `<details class="pfBlock">
      <summary>本会话额外设定（可选）—— 只在这个群里覆盖成员默认人设</summary>
      <div style="font-size:11px;color:var(--ink-3);margin:8px 0 6px">留空＝用成员自己的默认人设（在左侧 ⋯ → 个人资料 里设）。</div>` +
      list.map(m => `<div style="margin-bottom:8px">
        <div style="font-size:12px;color:var(--ink-2);margin-bottom:3px">${esc(m.name)} <span style="color:var(--ink-4);font-size:11px">${esc(m.model)}</span></div>
        <textarea class="personaInput" data-id="${m.id}" rows="2" placeholder="例如：本群里你是审稿人，只挑毛病，不给方案"
          style="width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical">${esc(st.personas?.[m.id] || '')}</textarea>
      </div>`).join('') + `</details>`;

    const fa = $('flowArea');
    if (mode !== 'flow') { fa.innerHTML = ''; return; }
    const beats = st.autoBeats ?? 3;
    // 发言倾向已经挪到「人物卡」里（全局），这里只留给"谁愿意开口"的一个只读提示
    fa.innerHTML = `<div style="font-size:11px;color:var(--ink-3);line-height:1.8;margin-bottom:10px">
        每个成员的主动程度在<b>人物卡 → 发言积极度</b>里设（全局生效）。<br>
        ${list.map(m => `${esc(m.name)}：${({ 0: '沉默', 30: '少言', 50: '适中', 80: '活跃' })[Number(m.talk ?? 50)] || (Number(m.talk ?? 50) + '%')}`).join('　·　')}
      </div>` +
      `<div style="font-size:12px;color:var(--ink-3);margin:6px 0 6px">自动续拍（一条消息后最多几个人开口）：</div>
       <input id="rsBeats" type="number" min="1" max="10" step="1" value="${beats}" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px">
       <div style="font-size:11px;color:var(--ink-4);margin-top:6px">每拍调用一次模型，拍数越多越慢越贵。默认 3。</div>`;
  };
  $('rsMode').onchange = renderPersona;
  renderPersona();

  const renderOrder = () => {
    const list = $('orderList');
    if (!list) return;
    list.innerHTML = order.map((id, i) => {
      const m = memberById(id);
      if (!m) return '';
      return `<div class="mrow"><span>${i + 1}. ${esc(m.name)}</span><span class="mm">${esc(m.model)}</span>
        <button data-mv="up" data-i="${i}" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button data-mv="down" data-i="${i}" ${i === order.length - 1 ? 'disabled' : ''}>↓</button></div>`;
    }).join('');
    list.querySelectorAll('button').forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      const j = b.dataset.mv === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      renderOrder();
    });
  };
  if (isGroup) renderOrder();

  $('rsGo').onclick = async () => {
    const v = Number($('rsHist').value);
    const mode = $('rsMode').value;
    const rounds = Number($('rsRounds').value);
    const personas = {};
    box.querySelectorAll('.personaInput').forEach(t => { if (t.value.trim()) personas[t.dataset.id] = t.value.trim(); });

    const beatsEl = $('rsBeats');
    const autoBeats = beatsEl ? Number(beatsEl.value) : undefined;
    const body = { room: active, histChars: v, mode, personas, maxRounds: rounds };
    if (autoBeats !== undefined) body.autoBeats = autoBeats;
    const r = await fetch('/api/room-settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(x => x.json());
    if (!r.ok) { alert('保存失败：' + (r.error || '未知')); return; }
    roomSettings[active] = r.settings;
    if (isGroup) {
      const o = await fetch('/api/rooms/order', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room: active, order }) }).then(x => x.json());
      if (!o.ok) { alert('顺序保存失败：' + (o.error || '未知')); return; }
      rooms[active].members = o.order;
      refreshHeader();
      renderSide();
    }
    $('modal').style.display = 'none';
  };
}

// 设置 → 📱 手机访问：显示地址与口令（只在本机有效）
async function openAccessModal(){
  const box = $('modalBox');
  box.style.width = '520px';
  const info = await fetch('/api/access-info').then(r => r.json()).catch(() => ({ ok: false, error: '取不到' }));
  if (!info.ok) { box.style.width = ''; alert('只在电脑本机才能看这个：' + (info.error || '')); return; }
  const urls = (info.ips || []).map(ip => `http://${ip}:${info.port}`).join('\n') || '（没检测到内网地址）';
  box.innerHTML = `<h3>📱 手机访问</h3>
    <div style="font-size:12px;color:var(--ink-3);line-height:1.8;margin:8px 0 12px">
      手机连同一个 Wi-Fi，打开下面地址，输一次口令就能进。电脑本机访问不用口令。
    </div>
    <label class="mc-lab">地址（点复制）</label>
    <textarea id="acUrls" rows="${Math.max(1, (info.ips || []).length)}" class="mc-in" readonly style="font-family:ui-monospace,Consolas,monospace;font-size:13px">${esc(urls)}</textarea>
    <label class="mc-lab">口令（6 位数字，可改）</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="acPw" class="mc-in" value="${esc(info.password)}" style="font-family:ui-monospace,Consolas,monospace;font-size:18px;letter-spacing:4px;text-align:center;width:160px">
      <button id="acCopy" style="padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12px">复制口令</button>
      <button id="acSave" class="primary" style="padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer;font-size:12px">保存</button>
    </div>
    ${info.lanOpen ? '' : `<div style="font-size:11px;color:#a83a2c;margin-top:10px">⚠️ 服务当前只监听本机（127.0.0.1），手机连不上。用 <code>--host 0.0.0.0</code> 启动才行。</div>`}
    <div style="font-size:11px;color:var(--ink-4);margin-top:12px;line-height:1.7">
      注意：局域网里是 HTTP 明文，同一 Wi-Fi 下的技术用户抓包能看到口令。家里/自己办公室够用，公共 Wi-Fi 别开。
    </div>
    <div class="foot"><button id="acClose">关闭</button></div>`;
  $('modal').style.display = 'flex';
  const close = () => { box.style.width = ''; $('modal').style.display = 'none'; };
  $('acClose').onclick = close;
  $('acCopy').onclick = async () => {
    try { await navigator.clipboard.writeText($('acPw').value); $('acCopy').textContent = '已复制 ✓'; }
    catch { $('acPw').select(); document.execCommand('copy'); $('acCopy').textContent = '已复制 ✓'; }
    setTimeout(() => { $('acCopy').textContent = '复制口令'; }, 1500);
  };
  $('acSave').onclick = async () => {
    const r = await apiPost('/api/access-password', { password: $('acPw').value.trim() });
    if (!r.ok) { alert('保存失败：' + (r.error || '未知')); return; }
    $('acPw').value = r.password;
    alert('已保存。手机上要重新输一次新口令。');
  };
}

const GRAD = 'linear-gradient(135deg, #dbeafe 0%, #ede9fe 35%, #fce7f3 65%, #fef3c7 100%)';
const DARK_GRAD = 'linear-gradient(160deg, #15171c 0%, #1c2029 45%, #111317 100%)';
let themeState = { dark: true, gradient: true, color: 'var(--bg)', pattern: 'none', image: '' };
function patternCss(p){
  return {
    none: null,
    dots: 'radial-gradient(rgba(0,0,0,.08) 1px, transparent 1px)',
    grid: 'linear-gradient(rgba(0,0,0,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px)',
    diag: 'repeating-linear-gradient(45deg, rgba(0,0,0,.045) 0 2px, transparent 2px 12px)',
  }[p] || null;
}
// 暖纸主题接管开关：true = 强制浅色纸张背景（本批视觉层的代价：背景设置暂时失效）
// 想恢复原来的深色/自定义背景，把这里改成 false 即可。
const PAPER_THEME = true;
function applyTheme(t){
  if (PAPER_THEME) {
    themeState = { dark: false, gradient: false, color: '#f6f0e7', pattern: 'none', image: '' };
    document.body.classList.remove('dark');
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = '#f6f0e7';
    return;
  }
  themeState = { dark: t.dark !== false, gradient: !!t.gradient, color: t.color || 'var(--bg)', pattern: t.pattern || 'none', image: t.image || '' };
  document.body.classList.toggle('dark', themeState.dark);
  const body = document.body.style;
  const pat = patternCss(themeState.pattern);
  const layers = [], sizes = [];
  if (pat) {
    layers.push(pat);
    sizes.push(themeState.pattern === 'dots' ? '16px 16px' : themeState.pattern === 'grid' ? '24px 24px' : 'auto');
  }
  if (themeState.image) { layers.push(`url("${themeState.image}")`); sizes.push('cover'); }
  else if (themeState.dark) { layers.push(themeState.gradient ? DARK_GRAD : (themeState.color || '#17181c')); sizes.push('auto'); }
  else { layers.push(themeState.gradient ? GRAD : 'none'); if (themeState.gradient) sizes.push('auto'); }
  body.backgroundImage = layers.join(', ');
  body.backgroundSize = sizes.join(', ');
  body.backgroundRepeat = 'no-repeat';
  body.backgroundPosition = 'center';
  body.backgroundAttachment = 'fixed';
  body.backgroundColor = themeState.image ? '#17181c' : (themeState.gradient ? '' : (themeState.dark ? (themeState.color || '#17181c') : themeState.color));
}

async function runImport(data, box){
  const picks = [...box.querySelectorAll('.impRoom:checked')].map(c => +c.value);
  if (!picks.length) { alert('至少选一个要导入的会话'); return; }
  const keys = Object.keys(data.rooms || {});
  const sources = picks.map(i => ({ name: data.rooms[keys[i]].name, messages: data.rooms[keys[i]].messages || [] }));
  let target = $('impTarget').value;
  if (target === '__new__') {
    const name = '导入-' + new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    const r = await fetch('/api/rooms/create', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, members: M.map(m => m.id) }) }).then(x => x.json());
    if (!r.ok) { alert('创建群失败'); return; }
    rooms[r.id] = { name, members: M.map(m => m.id) };
    target = r.id;
    renderSide();
  }
  $('impGo').disabled = true; $('impGo').textContent = '导入中…';
  const r = await fetch('/api/backup/import', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ target, sources }) }).then(x => x.json());
  if ($('impGo')) { $('impGo').disabled = false; $('impGo').textContent = '开始导入'; }
  if (r.ok) {
    $('impResult').innerHTML = `✅ 已导入 ${r.count} 条到「${esc(roomName(target))}」`;
    if (active === target) openRoom(target);
  } else {
    $('impResult').innerHTML = `<span style="color:#dc2626">导入失败：${esc(r.error || '未知')}</span>`;
  }
}
